<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>asalocal · Yönetim Paneli</title>
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#23211c;--ink2:#5f5a50;--line:#e2ddd2;--accent:#9a6a4e;--accent2:#7d8c6a;--gold:#b8944f;--danger:#b03a2e;--shadow:0 1px 3px rgba(40,35,25,.08),0 6px 20px rgba(40,35,25,.05)}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter",-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
h1,h2,h3{font-family:Georgia,serif;margin:0}
.topbar{background:#2f2a22;color:#f4efe6;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar .b{font-family:Georgia,serif;font-size:19px}.topbar .b b{color:#e3c98f}
.topbar .s{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.7}
.logout{background:none;border:1px solid rgba(255,255,255,.25);color:#f4efe6;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:600;cursor:pointer}
.nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.stat b{font-size:26px;display:block;font-family:Georgia,serif}
.stat span{font-size:12px;color:var(--ink2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:#fbfaf7;border-radius:9px;padding:8px 11px;font-size:14px;color:var(--ink)}
.toolbar input.search{flex:1;min-width:180px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 13px;font-size:13.5px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{background:#fdf3f1;color:var(--danger);border-color:#efd6d0}
.btn.sm{padding:5px 9px;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2)}
tr:hover td{background:#faf8f3}
.tablewrap{overflow:auto}
.pill{display:inline-block;font-size:11px;border-radius:99px;padding:2px 8px;border:1px solid var(--line)}
.pill.on{background:#eef3e6;color:#4e6a2e;border-color:#d6e3bf}
.pill.off{background:#f3efe9;color:#8a8172}
.pill.soon{background:#fbf3e6;color:#8a6d2f;border-color:#ecdcc0}
.pill.sp{background:#f3e6c9;color:#8a6d2f}
.muted{color:var(--ink2);font-size:12px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(30,25,15,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;z-index:60}
.modal.hide{display:none}
.sheet{background:var(--card);border-radius:16px;max-width:640px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet h2{font-size:20px;margin-bottom:14px}
.frow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.fld{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.fld label{font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:#fbfaf7;border-radius:9px;padding:9px 11px;font-size:14px;color:var(--ink);font-family:inherit}
.fld textarea{min-height:60px;resize:vertical}
.fld.check{flex-direction:row;align-items:center;gap:8px;min-width:auto}
.fld.check input{width:16px;height:16px}
.fld.check label{text-transform:none;font-size:13.5px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
/* login */
.login{max-width:360px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow);text-align:center}
.login h1{font-size:24px;margin-bottom:4px}.login h1 b{color:var(--accent)}
.login p{font-size:13px;color:var(--ink2);margin:6px 0 16px}
.login input{width:100%;border:1px solid var(--line);background:#fbfaf7;border-radius:11px;padding:12px;font-size:15px;margin-bottom:10px}
.err{color:var(--danger);font-size:13px;min-height:16px}
.hint{font-size:11.5px;color:var(--ink2);margin-top:12px;line-height:1.5}
.acc{display:flex;flex-direction:column;gap:8px}
.accitem{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.acchead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;user-select:none}
.acchead:hover{background:#faf8f4}
.accbody{border-top:1px solid var(--line);padding:6px 0}
.accrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;font-size:13.5px}
.accrow:not(:last-child){border-bottom:1px solid #f0ece3}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal hide" id="modal"><div class="sheet" id="sheet"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CFG={url:"https://tosqsabuaomgqjtogdrn.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvc3FzYWJ1YW9tZ3FqdG9nZHJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNjc5NTAsImV4cCI6MjEwMTg0Mzk1MH0.KHx2yJrQvkQoRSwqEE5uVSbmOlvfUkKXeKejFqO_Nz0",pw:"asaadmin2026"};
let db=null; try{ db=window.supabase.createClient(CFG.url,CFG.key); }catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const arr=s=>(s||"").split(",").map(x=>x.trim()).filter(Boolean);
let DATA={venues:[],cities:[],members:[],comments:[],ads:[],trips:0};
let seg="ozet";

function isAuthed(){ try{return sessionStorage.getItem("asa_admin")==="1";}catch(e){return false;} }

function renderLogin(msg){
  $("app").innerHTML='<div class="login"><h1><b>asa</b>local · Yönetim</h1><p>Yönetici şifresi ile giriş yap</p><input id="apw" type="password" placeholder="Yönetici şifresi" autocomplete="off"><div class="err" id="aerr">'+(msg||"")+'</div><button class="btn primary" id="abtn" style="width:100%">Giriş</button><div class="hint">Prototip: paylaşımlı yönetici şifresi. Gerçek rol/kimlik doğrulama sonraki aşamada.</div></div>';
  $("abtn").onclick=()=>{ if($("apw").value===CFG.pw){ try{sessionStorage.setItem("asa_admin","1");}catch(e){} boot(); } else { $("aerr").textContent="Şifre yanlış."; } };
  $("apw").onkeydown=e=>{if(e.key==="Enter")$("abtn").click();};
}

async function loadAll(){
  try{ const {data}=await db.from("venues").select("*").order("name"); DATA.venues=data||[]; }catch(e){}
  try{ const {data}=await db.from("cities").select("*").order("name"); DATA.cities=data||[]; }catch(e){}
  try{ const {data}=await db.from("members").select("*").order("created_at",{ascending:false}); DATA.members=data||[]; }catch(e){}
  try{ const {data}=await db.from("comments").select("*").order("created_at",{ascending:false}); DATA.comments=data||[]; }catch(e){}
  try{ const {data}=await db.from("ads").select("*").order("id"); DATA.ads=data||[]; }catch(e){}
  try{ const {count}=await db.from("trips").select("*",{count:"exact",head:true}); DATA.trips=count||0; }catch(e){}
}

function shell(body){
  $("app").innerHTML=
   '<div class="topbar"><div><div class="b"><b>asa</b>local · Yönetim</div><div class="s">Merkezi kontrol paneli</div></div><button class="logout" id="lo">Çıkış</button></div>'
   +'<div class="wrap"><div class="nav" id="nav"></div><div id="body"></div></div>';
  $("lo").onclick=()=>{ try{sessionStorage.removeItem("asa_admin");}catch(e){} renderLogin(); };
  const segs=[["ozet","Özet"],["venues","Mekanlar"],["cities","Şehirler"],["tags","Etiketler"],["comments","Moderasyon"],["ads","Reklamlar"],["members","Üyeler"]];
  $("nav").innerHTML=segs.map(s=>'<button class="'+(seg===s[0]?"on":"")+'" onclick="go(\''+s[0]+'\')">'+s[1]+'</button>').join("");
  $("body").innerHTML=body;
}
function go(s){ seg=s; render(); }

function render(){
  if(seg==="ozet") return renderOzet();
  if(seg==="venues") return renderVenues();
  if(seg==="cities") return renderCities();
  if(seg==="tags") return renderTags();
  if(seg==="comments") return renderComments();
  if(seg==="ads") return renderAds();
  if(seg==="members") return renderMembers();
}

function renderOzet(){
  const v=DATA.venues, act=v.filter(x=>x.active).length, sp=v.filter(x=>x.sponsored).length, ck=v.filter(x=>x.conf==="low").length;
  const body='<div class="cards">'
    +stat(v.length,"Mekan")+stat(act,"Aktif mekan")+stat(DATA.cities.filter(c=>c.status==="active").length+"/"+DATA.cities.length,"Aktif/Toplam şehir")
    +stat(DATA.members.length,"Üye")+stat(DATA.comments.length,"Yorum")+stat(DATA.trips,"Gezi talebi")+stat(DATA.ads.filter(a=>a.active).length,"Aktif reklam")+stat(ck,"Kontrol gereken")
    +'</div><div class="panel"><h3 style="margin-bottom:8px">Hızlı bakış</h3><p class="muted">Kontrol bekleyen ('+ck+') düşük güvenli mekan, '+sp+' sponsorlu mekan. Mekanlar sekmesinden düzenle; değişiklikler yayına alındığında siteye yansıyacak.</p></div>';
  shell(body);
}
function stat(n,l){ return '<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>'; }

/* ---------- MEKANLAR ---------- */
let vFilter={q:"",city:"",active:""};
function renderVenues(){
  const cities=[...new Set(DATA.venues.map(v=>v.city))];
  let list=DATA.venues.filter(v=>{
    if(vFilter.city&&v.city!==vFilter.city)return false;
    if(vFilter.active==="1"&&!v.active)return false;
    if(vFilter.active==="0"&&v.active)return false;
    if(vFilter.q){ const q=vFilter.q.toLowerCase(); if(!((v.name||"").toLowerCase().includes(q)||(v.area||"").toLowerCase().includes(q)||(v.tags||[]).join(",").toLowerCase().includes(q)||(v.type||"").toLowerCase().includes(q)))return false; }
    return true;
  });
  const body='<div class="panel"><div class="toolbar">'
    +'<input class="search" id="vq" placeholder="Ara: ad, semt, etiket, tür…" value="'+esc(vFilter.q)+'">'
    +'<select id="vcity"><option value="">Tüm şehirler</option>'+cities.map(c=>'<option'+(vFilter.city===c?" selected":"")+'>'+esc(c)+'</option>').join("")+'</select>'
    +'<select id="vact"><option value="">Hepsi</option><option value="1"'+(vFilter.active==="1"?" selected":"")+'>Aktif</option><option value="0"'+(vFilter.active==="0"?" selected":"")+'>Pasif</option></select>'
    +'<button class="btn primary" onclick="editVenue(null)">+ Yeni mekan</button>'
    +'<span class="muted">'+list.length+' / '+DATA.venues.length+'</span></div>'
    +'<div class="tablewrap"><table><thead><tr><th>Ad</th><th>Şehir · Semt</th><th>Tür</th><th>Etiketler</th><th>Saat</th><th>Durum</th><th></th></tr></thead><tbody>'
    +list.map(v=>'<tr>'
      +'<td><b>'+esc(v.name)+'</b>'+(v.conf==="low"?' <span class="pill soon">kontrol</span>':'')+(v.sponsored?' <span class="pill sp">sponsor</span>':'')+'</td>'
      +'<td>'+esc(v.city)+'<div class="muted">'+esc(v.area||"")+'</div></td>'
      +'<td>'+esc(v.type||"")+'</td>'
      +'<td class="muted">'+esc((v.tags||[]).join(", "))+'</td>'
      +'<td class="muted">'+esc(v.hours||"")+'</td>'
      +'<td>'+(v.active?'<span class="pill on">aktif</span>':'<span class="pill off">pasif</span>')+'</td>'
      +'<td style="white-space:nowrap"><button class="btn sm" onclick="editVenue(\''+esc(v.id)+'\')">Düzenle</button> <button class="btn sm" onclick="toggleVenue(\''+esc(v.id)+'\')">'+(v.active?"Pasifle":"Aktifle")+'</button></td>'
      +'</tr>').join("")
    +'</tbody></table></div></div>';
  shell(body);
  $("vq").oninput=()=>{vFilter.q=$("vq").value; const l=DATA.venues; renderVenues(); $("vq").focus(); const el=$("vq"); el.setSelectionRange(el.value.length,el.value.length);};
  $("vcity").onchange=()=>{vFilter.city=$("vcity").value; renderVenues();};
  $("vact").onchange=()=>{vFilter.active=$("vact").value; renderVenues();};
}
function venueById(id){ return DATA.venues.find(v=>v.id===id); }
function editVenue(id){
  const v=id?venueById(id):{id:"",city:"Amsterdam",active:true,garden:false,walk_in:false,work:false,sponsored:false,tags:[],cats:[],best:[]};
  const isNew=!id;
  const f=(k,l,val,type)=>'<div class="fld"><label>'+l+'</label><input id="f_'+k+'" '+(type?'type="'+type+'"':'')+' value="'+esc(val)+'"></div>';
  const ta=(k,l,val)=>'<div class="fld" style="flex:1 1 100%"><label>'+l+'</label><textarea id="f_'+k+'">'+esc(val)+'</textarea></div>';
  const chk=(k,l,val)=>'<div class="fld check"><input type="checkbox" id="f_'+k+'" '+(val?"checked":"")+'><label>'+l+'</label></div>';
  const self=(k,l,val,opts)=>'<div class="fld"><label>'+l+'</label><select id="f_'+k+'">'+opts.map(o=>'<option'+(val===o?" selected":"")+'>'+o+'</option>').join("")+'</select></div>';
  $("sheet").innerHTML='<h2>'+(isNew?"Yeni mekan":"Mekanı düzenle")+'</h2>'
    +'<div class="frow">'+f("id","ID (kısa, benzersiz)",v.id)+f("name","Ad",v.name||"")+'</div>'
    +'<div class="frow">'+f("city","Şehir",v.city||"")+f("area","Semt",v.area||"")+f("type","Tür",v.type||"")+'</div>'
    +'<div class="frow">'+f("tags","Etiketler (virgülle)",(v.tags||[]).join(", "))+'</div>'
    +'<div class="frow">'+f("cats","Kategoriler (virgülle)",(v.cats||[]).join(", "))+f("best","Best (virgülle)",(v.best||[]).join(", "))+'</div>'
    +'<div class="frow">'+f("hours","Çalışma saatleri",v.hours||"")+self("resv","Rezervasyon",v.resv||"unknown",["no","rec","req","unknown"])+self("conf","Güven",v.conf||"high",["high","med","low"])+'</div>'
    +'<div class="frow">'+f("lat","Enlem (lat)",v.lat==null?"":v.lat)+f("lng","Boylam (lng)",v.lng==null?"":v.lng)+f("src","Kaynak",v.src||"")+'</div>'
    +'<div class="frow">'+f("web","Web",v.web||"")+f("ig","Instagram",v.ig||"")+'</div>'
    +'<div class="fld" style="flex:1 1 100%"><label>Fotoğraf (boşsa kategori görseli kullanılır)</label>'
      +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
        +'<input id="f_photo_url" value="'+esc(v.photo_url||"")+'" oninput="venuePhotoPrev()" placeholder="Foto URL (veya soldan yükle)" style="flex:1;min-width:220px">'
        +'<label class="btn" style="cursor:pointer">Fotoğraf yükle<input type="file" accept="image/*" hidden onchange="venuePhotoUpload(event)"></label>'
        +'<span id="f_upmsg" class="muted" style="font-size:12px"></span>'
      +'</div>'
      +'<div id="vPhotoPrev" style="margin-top:8px"></div></div>'
    +ta("tip","Yerli tüyosu (tip)",v.tip||"")
    +ta("description","Açıklama",v.description||"")
    +ta("note","Not",v.note||"")
    +'<div class="frow">'+chk("garden","Bahçeli / dış mekan",v.garden)+chk("walk_in","Rezervasyonsuz girilebilir",v.walk_in)+chk("work","Çalışmaya uygun",v.work)+chk("sponsored","Sponsorlu",v.sponsored)+chk("active","Aktif (yayında)",v.active)+'</div>'
    +'<div class="err" id="verr"></div>'
    +'<div class="foot"><button class="btn" onclick="closeModal()">Vazgeç</button>'+(isNew?"":'<button class="btn danger" onclick="delVenue(\''+esc(v.id)+'\')">Sil</button>')+'<button class="btn primary" id="vsave">Kaydet</button></div>';
  openModal();
  try{venuePhotoPrev();}catch(e){}
  $("vsave").onclick=()=>saveVenue(isNew);
}
async function saveVenue(isNew){
  const g=k=>{const e=$("f_"+k);return e?e.value:"";};
  const gc=k=>{const e=$("f_"+k);return e?e.checked:false;};
  const id=g("id").trim();
  if(!id||!g("name").trim()){ $("verr").textContent="ID ve Ad zorunlu."; return; }
  const row={id, name:g("name").trim(), city:g("city").trim()||"Amsterdam", area:g("area").trim(), type:g("type").trim(),
    tags:arr(g("tags")), cats:arr(g("cats")), best:arr(g("best")), hours:g("hours").trim()||null,
    resv:g("resv"), conf:g("conf"), src:g("src").trim()||null, web:g("web").trim()||null, ig:g("ig").trim()||null, photo_url:g("photo_url").trim()||null,
    tip:g("tip").trim()||null, description:g("description").trim()||null, note:g("note").trim()||null,
    lat:g("lat")?parseFloat(g("lat")):null, lng:g("lng")?parseFloat(g("lng")):null,
    garden:gc("garden"), walk_in:gc("walk_in"), work:gc("work"), sponsored:gc("sponsored"), active:gc("active"),
    updated_at:new Date().toISOString()};
  const btn=$("vsave"); btn.disabled=true; btn.textContent="Kaydediliyor…";
  try{ const {error}=await db.from("venues").upsert(row,{onConflict:"id"}); if(error)throw error; }catch(e){ $("verr").textContent="Hata: "+(e.message||e); btn.disabled=false; btn.textContent="Kaydet"; return; }
  const i=DATA.venues.findIndex(x=>x.id===id); if(i>=0)DATA.venues[i]=Object.assign(DATA.venues[i],row); else DATA.venues.push(row);
  closeModal(); renderVenues();
}
function venuePhotoPrev(){ const el=$("vPhotoPrev"); if(!el)return; const u=($("f_photo_url").value||"").trim(); el.innerHTML=u?'<img src="'+esc(u)+'" style="max-height:140px;border-radius:6px;border:1px solid #ddd" onerror="this.parentNode.innerHTML=\'<span style=color:#a33;font-size:12px>Görsel yüklenemedi — link doğrudan bir görsel dosyası mı?</span>\'">':''; }
async function venuePhotoUpload(ev){ const file=ev.target.files&&ev.target.files[0]; if(!file)return; const msg=$("f_upmsg"); if(msg)msg.textContent="Yükleniyor…"; try{ const url=await uploadToMedia(file,"venues"); $("f_photo_url").value=url; venuePhotoPrev(); if(msg)msg.textContent="✓ yüklendi"; }catch(e){ if(msg)msg.textContent="Hata: "+(e.message||e); } }
async function toggleVenue(id){ const v=venueById(id); if(!v)return; const na=!v.active; try{ await db.from("venues").update({active:na,updated_at:new Date().toISOString()}).eq("id",id); v.active=na; }catch(e){} renderVenues(); }
async function delVenue(id){ if(!confirm("Bu mekanı silmek istediğine emin misin?"))return; try{ await db.from("venues").delete().eq("id",id); }catch(e){} DATA.venues=DATA.venues.filter(v=>v.id!==id); closeModal(); renderVenues(); }

/* ---------- ŞEHİRLER ---------- */
function renderCities(){
  const body='<div class="panel"><div class="toolbar"><button class="btn primary" onclick="editCity(null)">+ Yeni şehir</button></div>'
    +'<div class="tablewrap"><table><thead><tr><th>Şehir</th><th>Ülke</th><th>Durum</th><th>Mekan</th><th></th></tr></thead><tbody>'
    +DATA.cities.map(c=>{const vn=DATA.venues.filter(v=>v.city===c.name).length;return '<tr><td>'+esc(c.flag||"")+' <b>'+esc(c.name)+'</b></td><td>'+esc(c.country||"")+'</td><td><span class="pill '+(c.status==="active"?"on":(c.status==="soon"?"soon":"off"))+'">'+esc(c.status)+'</span></td><td class="muted">'+vn+'</td><td><button class="btn sm" onclick="editCity(\''+esc(c.code)+'\')">Düzenle</button></td></tr>';}).join("")
    +'</tbody></table></div></div>';
  shell(body);
}
function editCity(code){
  const c=code?DATA.cities.find(x=>x.code===code):{code:"",name:"",country:"",flag:"",status:"draft"};
  const isNew=!code;
  const f=(k,l,val)=>'<div class="fld"><label>'+l+'</label><input id="c_'+k+'" value="'+esc(val)+'"></div>';
  $("sheet").innerHTML='<h2>'+(isNew?"Yeni şehir":"Şehri düzenle")+'</h2>'
    +'<div class="frow">'+f("code","Kod (benzersiz)",c.code)+f("name","Ad",c.name)+'</div>'
    +'<div class="frow">'+f("country","Ülke",c.country||"")+f("flag","Bayrak (emoji)",c.flag||"")+'</div>'
    +'<div class="frow"><div class="fld"><label>Durum</label><select id="c_status">'+["draft","soon","active","inactive"].map(o=>'<option'+(c.status===o?" selected":"")+'>'+o+'</option>').join("")+'</select></div></div>'
    +'<div class="err" id="cerr"></div><div class="foot"><button class="btn" onclick="closeModal()">Vazgeç</button><button class="btn primary" id="csave">Kaydet</button></div>';
  openModal();
  $("csave").onclick=async()=>{ const g=k=>$("c_"+k).value; const code2=g("code").trim(); if(!code2||!g("name").trim()){$("cerr").textContent="Kod ve Ad zorunlu.";return;} const row={code:code2,name:g("name").trim(),country:g("country").trim(),flag:g("flag").trim(),status:g("status"),updated_at:new Date().toISOString()}; try{await db.from("cities").upsert(row,{onConflict:"code"});}catch(e){$("cerr").textContent="Hata: "+(e.message||e);return;} const i=DATA.cities.findIndex(x=>x.code===code2); if(i>=0)DATA.cities[i]=Object.assign(DATA.cities[i],row); else DATA.cities.push(row); closeModal(); renderCities(); };
}

/* ---------- ETIKETLER ---------- */
let openTag=null;
function renderTags(){
  const map={}; DATA.venues.forEach(v=>(v.tags||[]).forEach(t=>{map[t]=(map[t]||0)+1;}));
  const rows=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const body='<div class="panel"><h3 style="margin-bottom:10px">Etiketler ('+rows.length+')</h3><p class="muted" style="margin-bottom:12px">Bir etikete tıkla → o etiketteki mekanlar açılır; oradan düzenle ya da etiketi mekandan kaldır. Etiketleri karar motoru ve filtreler kullanır.</p>'
    +'<div class="acc">'+rows.map(r=>{
      const t=r[0], open=(openTag===t);
      let inner='';
      if(open){
        const vs=DATA.venues.filter(v=>(v.tags||[]).indexOf(t)>-1).sort((a,b)=>(a.name||"").localeCompare(b.name||"","tr"));
        inner='<div class="accbody">'+vs.map(v=>'<div class="accrow"><span><b>'+esc(v.name)+'</b> <span class="muted">· '+esc(v.city||"")+(v.area?" · "+esc(v.area):"")+'</span></span>'
          +'<span style="white-space:nowrap"><button class="btn sm" onclick="editVenue(\''+esc(v.id)+'\')">Düzenle</button> <button class="btn sm danger" onclick="removeTag(\''+esc(v.id)+'\',\''+esc(t).replace(/'/g,"\\'")+'\')">Etiketi kaldır</button></span></div>').join("")+'</div>';
      }
      return '<div class="accitem"><div class="acchead" onclick="toggleTag(\''+esc(t).replace(/'/g,"\\'")+'\')"><span>'+(open?"▾":"▸")+' <b>'+esc(t)+'</b></span><span class="pill">'+r[1]+' mekan</span></div>'+inner+'</div>';
    }).join("")+'</div></div>';
  shell(body);
}
function toggleTag(t){ openTag=(openTag===t?null:t); renderTags(); }
async function removeTag(id,t){
  const v=venueById(id); if(!v)return;
  const nt=(v.tags||[]).filter(x=>x!==t);
  try{ await db.from("venues").update({tags:nt,updated_at:new Date().toISOString()}).eq("id",id); }catch(e){ alert("Hata: "+(e.message||e)); return; }
  v.tags=nt; renderTags();
}

/* ---------- MODERASYON (yorumlar) ---------- */
function renderComments(){
  const body='<div class="panel"><h3 style="margin-bottom:10px">Yorumlar ('+DATA.comments.length+')</h3>'
    +(DATA.comments.length?'<div class="tablewrap"><table><thead><tr><th>Üye</th><th>Mekan</th><th>Yorum</th><th>Foto</th><th></th></tr></thead><tbody>'
    +DATA.comments.map(c=>{const v=venueById(c.venue_id);return '<tr><td>'+esc(c.display_name||c.email||"")+'</td><td>'+esc(v?v.name:c.venue_id)+'</td><td>'+esc((c.body||"").slice(0,120))+'</td><td>'+(c.photo_url?'📷':'')+'</td><td><button class="btn sm danger" onclick="delComment('+c.id+')">Kaldır</button></td></tr>';}).join("")
    +'</tbody></table></div>':'<p class="muted">Henüz yorum yok.</p>')+'</div>';
  shell(body);
}
async function delComment(id){ if(!confirm("Yorumu kaldır?"))return; try{await db.from("comments").delete().eq("id",id);}catch(e){} DATA.comments=DATA.comments.filter(c=>c.id!==id); renderComments(); }

/* ---------- REKLAMLAR ---------- */
const AD_SLOTS=["masthead","leaderboard","sidebar","inline","venue_card","decision","map_pin"];
const AD_TYPES=["display","native_venue","native_decision","html"];
const AD_FORMATS=["970x250","728x90","300x250","300x600","320x100","320x50"];
const SLOT_INFO={masthead:"Ana sayfa üstü geniş banner (Pano)",leaderboard:"Şehir banner / Plan üstü",sidebar:"Mekanlar yan sütun",inline:"Liste içi",venue_card:"Mekanlar arasına sponsorlu mekan kartı",decision:"Karar motoru sponsorlu öneri",map_pin:"Haritada sponsorlu pin (lat/lng gerekir)"};
function adById(id){ return DATA.ads.find(a=>a.id===id); }
function renderAds(){
  const body='<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3>Reklam kampanyaları ('+DATA.ads.length+')</h3><button class="btn primary" onclick="editAd(0)">+ Yeni reklam</button></div>'
    +'<p class="muted" style="margin-bottom:12px">Görsel yükle veya URL yapıştır, slotu seç, canlı önizle, aktif/pasif yap. Değişiklikler siteye anında yansır.</p>'
    +(DATA.ads.length?'<div class="tablewrap"><table><thead><tr><th>Önizleme</th><th>Slot</th><th>Boyut</th><th>Tür</th><th>Sponsor</th><th>Durum</th><th></th></tr></thead><tbody>'
    +DATA.ads.map(a=>'<tr>'
      +'<td>'+(a.image_url?'<img src="'+esc(a.image_url)+'" style="width:70px;height:40px;object-fit:cover;border-radius:4px;border:1px solid #ddd">':'<span class="muted">—</span>')+'</td>'
      +'<td><b>'+esc(a.slot)+'</b></td><td>'+esc(a.format||"")+'</td><td>'+esc(a.creative_type||"")+'</td><td>'+esc(a.sponsor||"")+'</td>'
      +'<td>'+(a.active?'<span class="pill on">aktif</span>':'<span class="pill off">pasif</span>')+'</td>'
      +'<td style="white-space:nowrap"><button class="btn sm" onclick="editAd('+a.id+')">Düzenle</button> <button class="btn sm" onclick="toggleAd('+a.id+')">'+(a.active?"Pasifle":"Aktifle")+'</button></td></tr>').join("")
    +'</tbody></table></div>':'<p class="muted">Henüz reklam yok. "+ Yeni reklam" ile ekle.</p>')+'</div>';
  shell(body);
}
async function toggleAd(id){ const a=adById(id); if(!a)return; const na=!a.active; try{await db.from("ads").update({active:na}).eq("id",id);}catch(e){} a.active=na; renderAds(); }

function editAd(id){
  const a=id?adById(id):{id:0,slot:"masthead",creative_type:"display",format:"970x250",active:true,weight:1};
  const isNew=!id;
  const f=(k,l,val,type)=>'<div class="fld"><label>'+l+'</label><input id="a_'+k+'" '+(type?'type="'+type+'"':'')+' value="'+esc(val==null?"":val)+'" oninput="adPreview()"></div>';
  const ta=(k,l,val)=>'<div class="fld" style="flex:1 1 100%"><label>'+l+'</label><textarea id="a_'+k+'" oninput="adPreview()">'+esc(val||"")+'</textarea></div>';
  const chk=(k,l,val)=>'<div class="fld check"><input type="checkbox" id="a_'+k+'" '+(val?"checked":"")+'><label>'+l+'</label></div>';
  const sel=(k,l,val,opts)=>'<div class="fld"><label>'+l+'</label><select id="a_'+k+'" onchange="adPreview()">'+opts.map(o=>'<option'+(val===o?" selected":"")+'>'+o+'</option>').join("")+'</select></div>';
  $("sheet").innerHTML='<h2>'+(isNew?"Yeni reklam":"Reklamı düzenle")+'</h2>'
    +'<div class="frow">'+sel("creative_type","Kreatif türü",a.creative_type||"display",AD_TYPES)+sel("slot","Slot (yer)",a.slot||"masthead",AD_SLOTS)+sel("format","Boyut (display)",a.format||"970x250",AD_FORMATS)+'</div>'
    +'<div class="muted" id="slotHint" style="margin:-4px 0 10px;font-size:12px"></div>'
    +'<div class="frow">'+f("sponsor","Sponsor / marka",a.sponsor||"")+f("scope_city","Şehir (boş = tümü)",a.scope_city||"")+f("weight","Ağırlık (sıra)",a.weight==null?1:a.weight,"number")+'</div>'
    +'<div class="frow">'+f("title","Başlık",a.title||"")+'</div>'
    +ta("body","Metin",a.body||"")
    +'<div class="fld" style="flex:1 1 100%"><label>Görsel</label>'
      +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
        +'<input id="a_image_url" value="'+esc(a.image_url||"")+'" oninput="adPreview()" placeholder="Görsel URL (veya soldan yükle)" style="flex:1;min-width:220px">'
        +'<label class="btn" style="cursor:pointer">Görsel yükle<input type="file" accept="image/*" hidden onchange="adUpload(event)"></label>'
        +'<span id="a_upmsg" class="muted" style="font-size:12px"></span>'
      +'</div></div>'
    +'<div class="frow">'+f("cta_url","Tıklama linki (CTA URL)",a.cta_url||"")+'</div>'
    +'<div class="frow">'+f("width","Genişlik (px, ops.)",a.width==null?"":a.width,"number")+f("height","Yükseklik (px, ops.)",a.height==null?"":a.height,"number")+'</div>'
    +'<div class="frow">'+f("lat","Enlem (map_pin için)",a.lat==null?"":a.lat)+f("lng","Boylam (map_pin için)",a.lng==null?"":a.lng)+'</div>'
    +'<div class="frow">'+chk("active","Aktif (yayında)",a.active!==false)+'</div>'
    +'<div class="fld" style="flex:1 1 100%"><label>Canlı önizleme</label><div id="adPrev" style="background:#faf9f5;border:1px dashed #cfc9bd;border-radius:8px;padding:14px;min-height:70px;display:flex;align-items:center;justify-content:center"></div></div>'
    +'<div class="err" id="aerr"></div>'
    +'<div class="foot"><button class="btn" onclick="closeModal()">Vazgeç</button>'+(isNew?"":'<button class="btn danger" onclick="delAd('+a.id+')">Sil</button>')+'<button class="btn primary" id="asave">Kaydet</button></div>';
  openModal();
  $("asave").onclick=()=>saveAd(isNew,id);
  adPreview();
}
function adPreview(){
  const g=k=>{const e=$("a_"+k);return e?e.value:"";};
  const hint=$("slotHint"); if(hint)hint.textContent=SLOT_INFO[g("slot")]||"";
  const p=$("adPrev"); if(!p)return;
  const img=g("image_url").trim(), title=esc(g("title")), body=esc(g("body")), sponsor=esc(g("sponsor")), ct=g("creative_type");
  if(ct==="native_venue"||ct==="native_decision"){
    p.innerHTML='<div style="text-align:left;max-width:360px;font-family:Georgia,serif"><span style="font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:#a63936;font-weight:700">Sponsorlu · '+sponsor+'</span><div style="font-size:18px;font-weight:600;margin:4px 0">'+(title||"Başlık")+'</div><div style="font-size:13px;color:#555;font-family:sans-serif">'+(body||"")+'</div></div>';
  } else if(img){
    p.innerHTML='<img src="'+esc(img)+'" style="max-width:100%;max-height:220px;border-radius:4px" onerror="this.parentNode.innerHTML=\'<span style=color:#a33>Görsel yüklenemedi — link doğrudan bir görsel dosyası mı? (.jpg/.png)\'">';
  } else {
    p.innerHTML='<div style="text-align:center;color:#888"><b>'+(title||"Görsel yok")+'</b><div style="font-size:12px">'+(body||"Görsel URL gir ya da yükle")+'</div></div>';
  }
}
async function adUpload(ev){
  const file=ev.target.files&&ev.target.files[0]; if(!file)return;
  const msg=$("a_upmsg"); if(msg)msg.textContent="Yükleniyor…";
  try{
    const url=await uploadToMedia(file,"ads");
    $("a_image_url").value=url; adPreview();
    if(msg)msg.textContent="✓ yüklendi";
  }catch(e){ if(msg)msg.textContent="Hata: "+(e.message||e); }
}
async function uploadToMedia(file, prefix){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
  const path=(prefix||"img")+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
  const {error}=await db.storage.from("media").upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type||"image/jpeg"});
  if(error)throw error;
  const {data}=db.storage.from("media").getPublicUrl(path);
  return data.publicUrl;
}
async function saveAd(isNew,id){
  const g=k=>{const e=$("a_"+k);return e?e.value.trim():"";};
  const gc=k=>{const e=$("a_"+k);return e?e.checked:false;};
  const num=v=>v===""?null:(isNaN(+v)?null:+v);
  const row={ slot:g("slot"), creative_type:g("creative_type"), format:g("format")||null, scope_city:g("scope_city")||null,
    sponsor:g("sponsor")||null, title:g("title")||null, body:g("body")||null, image_url:g("image_url")||null, cta_url:g("cta_url")||null,
    weight:num(g("weight"))||1, width:num(g("width")), height:num(g("height")), lat:num(g("lat")), lng:num(g("lng")), active:gc("active") };
  const btn=$("asave"); btn.disabled=true; btn.textContent="Kaydediliyor…";
  try{
    if(isNew){ const {data,error}=await db.from("ads").insert(row).select().single(); if(error)throw error; DATA.ads.push(data); }
    else { row.id=id; const {error}=await db.from("ads").update(row).eq("id",id); if(error)throw error; const i=DATA.ads.findIndex(x=>x.id===id); if(i>=0)DATA.ads[i]=Object.assign(DATA.ads[i],row); }
  }catch(e){ $("aerr").textContent="Hata: "+(e.message||e); btn.disabled=false; btn.textContent="Kaydet"; return; }
  closeModal(); renderAds();
}
async function delAd(id){ if(!confirm("Bu reklamı silmek istediğine emin misin?"))return; try{ await db.from("ads").delete().eq("id",id); }catch(e){} DATA.ads=DATA.ads.filter(a=>a.id!==id); closeModal(); renderAds(); }

/* ---------- ÜYELER ---------- */
let openMember=null, memberDetail={};
function fmtDate(s){ try{ if(!s)return"—"; const d=new Date(s); return d.toLocaleDateString("tr-TR",{year:"numeric",month:"short",day:"numeric"}); }catch(e){ return "—"; } }
function renderMembers(){
  const ms=DATA.members;
  const blk=ms.filter(m=>m.blocked).length;
  let body='<div class="panel"><h3 style="margin-bottom:6px">Üyeler ('+ms.length+')</h3><p class="muted" style="margin-bottom:12px">'+blk+' bloke. Bir üyeye tıkla → detayları (kaydettikleri, yorum sayısı) aç. Bloke edilen üye giriş yapamaz.</p>';
  if(!ms.length){ body+='<p class="muted">Henüz üye yok.</p></div>'; shell(body); return; }
  body+='<div class="acc">'+ms.map(m=>{
    const open=(openMember===m.email);
    let inner='';
    if(open){
      const d=memberDetail[m.email];
      if(!d){ inner='<div class="accbody"><div class="accrow"><span class="muted">Yükleniyor…</span></div></div>'; }
      else{
        const favNames=(d.favs||[]).map(id=>{const v=venueById(id);return v?v.name:id;});
        inner='<div class="accbody">'
          +'<div class="accrow"><span><b>Katılım</b></span><span>'+fmtDate(m.created_at)+'</span></div>'
          +'<div class="accrow"><span><b>Kaydettikleri ('+(d.favs||[]).length+')</b></span><span style="max-width:60%;text-align:right">'+(favNames.length?esc(favNames.slice(0,12).join(", ")):'<span class="muted">yok</span>')+'</span></div>'
          +'<div class="accrow"><span><b>Yorum / fotoğraf</b></span><span>'+(d.comments||0)+' yorum · '+(d.photos||0)+' foto</span></div>'
          +'</div>';
      }
    }
    return '<div class="accitem"><div class="acchead" onclick="toggleMember(\''+esc(m.email).replace(/'/g,"\\'")+'\')">'
      +'<span>'+(open?"▾":"▸")+' <b>'+esc(m.display_name||m.email.split("@")[0])+'</b> <span class="muted">· '+esc(m.email)+'</span>'+(m.blocked?' <span class="pill off">bloke</span>':'')+'</span>'
      +'<span style="white-space:nowrap"><span class="pill">'+esc(m.tier||"Kaşif")+' · '+(m.points!=null?m.points:0)+' puan</span> '
        +'<button class="btn sm" onclick="event.stopPropagation();toggleBlock(\''+esc(m.email).replace(/'/g,"\\'")+'\')">'+(m.blocked?"Blokeyi kaldır":"Bloke et")+'</button> '
        +'<button class="btn sm danger" onclick="event.stopPropagation();delMember(\''+esc(m.email).replace(/'/g,"\\'")+'\')">Sil</button></span>'
      +'</div>'+inner+'</div>';
  }).join("")+'</div></div>';
  shell(body);
}
async function toggleMember(email){
  if(openMember===email){ openMember=null; renderMembers(); return; }
  openMember=email; renderMembers();
  if(!memberDetail[email]){
    const d={favs:[],comments:0,photos:0};
    try{ const r=await db.from("favorites").select("venue_id").eq("email",email); d.favs=(r.data||[]).map(x=>x.venue_id); }catch(e){}
    try{ const r=await db.from("comments").select("id,photo_url").eq("email",email); d.comments=(r.data||[]).length; d.photos=(r.data||[]).filter(x=>x.photo_url).length; }catch(e){}
    memberDetail[email]=d;
    if(openMember===email) renderMembers();
  }
}
async function toggleBlock(email){
  const m=DATA.members.find(x=>x.email===email); if(!m)return;
  const nb=!m.blocked;
  try{ await db.from("members").update({blocked:nb,updated_at:new Date().toISOString()}).eq("email",email); }catch(e){ alert("Hata: "+(e.message||e)); return; }
  m.blocked=nb; renderMembers();
}
async function delMember(email){
  if(!confirm("Bu üyeliği ve üyenin favori/yorum verilerini kalıcı olarak silmek istediğine emin misin?\n\n"+email))return;
  try{
    await db.from("favorites").delete().eq("email",email);
    await db.from("comments").delete().eq("email",email);
    await db.from("members").delete().eq("email",email);
  }catch(e){ alert("Hata: "+(e.message||e)); return; }
  DATA.members=DATA.members.filter(x=>x.email!==email);
  openMember=null; renderMembers();
}

/* ---------- modal ---------- */
function openModal(){ $("modal").classList.remove("hide"); }
function closeModal(){ $("modal").classList.add("hide"); }
$("modal").onclick=e=>{ if(e.target===$("modal"))closeModal(); };

async function boot(){
  if(!isAuthed()){ renderLogin(); return; }
  $("app").innerHTML='<div class="wrap"><p class="muted" style="padding:40px;text-align:center">Yükleniyor…</p></div>';
  await loadAll();
  render();
}
boot();
</script>
</body>
</html>

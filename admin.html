<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>asalocal · Yönetim Paneli</title>
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#23211c;--ink2:#5f5a50;--line:#e2ddd2;--accent:#9a6a4e;--accent2:#7d8c6a;--gold:#b8944f;--danger:#b03a2e;--shadow:0 1px 3px rgba(40,35,25,.08),0 6px 20px rgba(40,35,25,.05)}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter",-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
h1,h2,h3{font-family:Georgia,serif;margin:0}
.topbar{background:#2f2a22;color:#f4efe6;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar .b{font-family:Georgia,serif;font-size:19px}.topbar .b b{color:#e3c98f}
.topbar .s{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.7}
.logout{background:none;border:1px solid rgba(255,255,255,.25);color:#f4efe6;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:600;cursor:pointer}
.nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.stat b{font-size:26px;display:block;font-family:Georgia,serif}
.stat span{font-size:12px;color:var(--ink2)}
.skel{background:linear-gradient(90deg,#efeae1 25%,#f6f3ec 37%,#efeae1 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:#fbfaf7;border-radius:9px;padding:8px 11px;font-size:14px;color:var(--ink)}
.toolbar input.search{flex:1;min-width:180px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 13px;font-size:13.5px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{background:#fdf3f1;color:var(--danger);border-color:#efd6d0}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2)}
tr:hover td{background:#faf8f3}
.tablewrap{overflow:auto}
.pill{display:inline-block;font-size:11px;border-radius:99px;padding:2px 8px;border:1px solid var(--line)}
.pill.on{background:#eef3e6;color:#4e6a2e;border-color:#d6e3bf}
.pill.off{background:#f3efe9;color:#8a8172}
.pill.soon{background:#fbf3e6;color:#8a6d2f;border-color:#ecdcc0}
.pill.sp{background:#f3e6c9;color:#8a6d2f}
.muted{color:var(--ink2);font-size:12px}
.err{color:var(--danger);font-size:13px;min-height:16px}
.notice{border:1px solid var(--line);background:#fbfaf7;border-radius:10px;padding:12px 14px;font-size:13.5px}
.notice.warn{background:#fbf3e6;border-color:#ecdcc0;color:#8a6d2f}
.notice.err{background:#fdf3f1;border-color:#efd6d0;color:var(--danger)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(30,25,15,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;z-index:60}
.modal.hide{display:none}
.sheet{background:var(--card);border-radius:16px;max-width:660px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet h2{font-size:20px;margin-bottom:14px}
.frow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.fld{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.fld label{font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:#fbfaf7;border-radius:9px;padding:9px 11px;font-size:14px;color:var(--ink);font-family:inherit}
.fld textarea{min-height:60px;resize:vertical}
.fld.check{flex-direction:row;align-items:center;gap:8px;min-width:auto}
.fld.check input{width:16px;height:16px}
.fld.check label{text-transform:none;font-size:13.5px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
/* login */
.login{max-width:360px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow);text-align:center}
.login h1{font-size:24px;margin-bottom:4px}.login h1 b{color:var(--accent)}
.login p{font-size:13px;color:var(--ink2);margin:6px 0 16px}
.login input{width:100%;border:1px solid var(--line);background:#fbfaf7;border-radius:11px;padding:12px;font-size:15px;margin-bottom:10px}
.hint{font-size:11.5px;color:var(--ink2);margin-top:12px;line-height:1.5}
.acc{display:flex;flex-direction:column;gap:8px}
.accitem{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.acchead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;user-select:none}
.accbody{border-top:1px solid var(--line);padding:6px 0}
.accrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;font-size:13.5px}
.accrow:not(:last-child){border-bottom:1px solid #f0ece3}
@media(max-width:620px){.modal{padding:0}.sheet{border-radius:0;min-height:100vh;max-width:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal hide" id="modal"><div class="sheet" id="sheet"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================================
   ASALOCAL Yönetim Paneli · FAZ 0B.1 — Salt-Okunur Admin UI Entegrasyonu
   - Özet sayaçları, Üye arama/listesi, Üye 360 → admin-api (privileged).
   - Bu 3 alan Supabase Auth JWT ister (super_admin/support).
   - Diğer sekmeler (Mekanlar/Şehirler/Etiketler/İçerik/Moderasyon/Reklamlar)
     mevcut anon akışıyla AYNEN korunur.
   - Ortak yönetici şifresi 0D'ye kadar dış kapı olarak kalır.
   - Güvenlik: yalnız anon anahtar; service_role YOK; iç RPC çağrısı YOK;
     yalnız admin-api Edge Function; tüm kullanıcı metni esc() ile basılır.
   ===================================================================== */
const CFG={url:"https://tosqsabuaomgqjtogdrn.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvc3FzYWJ1YW9tZ3FqdG9nZHJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNjc5NTAsImV4cCI6MjEwMTg0Mzk1MH0.KHx2yJrQvkQoRSwqEE5uVSbmOlvfUkKXeKejFqO_Nz0"};
const FN_URL=CFG.url+"/functions/v1/admin-api";
/* AOÇ-1: teşhis sözleşmesi ORTAK dosyadan yüklenir (admin'e KOPYALANMAZ) — /decision_contract.js
   Şehir motorunun DOĞRULANMIŞ AYNASI; gerçek tek-kaynak AOÇ-1B/AOÇ-3'te app de bu dosyayı kullanınca tamamlanır.
   Yüklenemezse sağlık üretilmez (fail-closed). */
let _contractLoad=null;
const _CONTRACT_URL='/decision_contract.js?v=a6743474f0b5b5b9';   // contract SHA-256(16); her güncellemede yenile
function ensureContract(){
  if(window.DecisionContract) return Promise.resolve(true);
  if(_contractLoad) return _contractLoad;                          // yalnız DEVAM EDEN yükleme paylaşılır
  _contractLoad=new Promise(function(res){
    var s=document.createElement('script'); s.src=_CONTRACT_URL; s.async=true; s.setAttribute('data-contract','1');
    function fail(){ try{ s.remove(); }catch(e){} _contractLoad=null; res(false); }   // retry gerçekten yeniden yükleyebilsin
    s.onload=function(){ if(window.DecisionContract) res(true); else fail(); };        // yüklendi ama global yoksa da başarısız say
    s.onerror=fail;
    document.head.appendChild(s);
  });
  return _contractLoad;
}
// FAZ 0D: ortak şifre KALDIRILDI. TEK Supabase istemcisi — authenticated admin oturumu,
// sessionStorage (sekme oturumu; localStorage'a JWT yazılmaz). Editör okuma/yazma da bu oturumdan
// geçer (RLS capability'e göre süzer). Tek GoTrueClient → çakışma yok.
let authClient=null; try{ authClient=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"asa-admin-auth",storage:window.sessionStorage}}); }catch(e){}
let db=authClient;
const $=id=>document.getElementById(id);
const esc=s=>(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const arr=s=>(s||"").split(",").map(x=>x.trim()).filter(Boolean);
let DATA={venues:[],cities:[],comments:[],ads:[],content:[]};
const CONTENT_DEFAULTS={
 "home.hero.title":"Özenle seçilmiş şehir keşfi, bilinçli gezginler için.",
 "home.hero.desc":"Google haritalarında binlerce pin var, ama hangisi gerçekten iyi? asalocal, şehirde yaşayan yerlilerin önerileriyle doluyor — turist gibi değil, bir yerli gibi plan yaparsın.",
 "home.cta":"Keşfet",
 "app.pano.h":"Bugün ne yapmak istiyorsun?",
 "app.pano.p":"Rembrandtpark'taki dairen merkez. Klasik turist değil, lokal yaşam modundasın…",
 "app.list.h":"Mekan envanteri",
 "app.map.h":"Harita",
 "app.de.h":"Karar motoru",
 "app.member.h":"Üyelik"
};
let seg="ozet";

let CAPS={admin:false,venues:false,cities:false,content:false,ads:false,moderate:false,members:false,superadmin:false};
function resetCaps(){ CAPS={admin:false,venues:false,cities:false,content:false,ads:false,moderate:false,members:false,superadmin:false}; }

// FAZ 0D: giriş = Supabase e-posta/şifre (ortak şifre yok). Sonra aktif admin + rol doğrulanır.
function renderLogin(msg){
  $("app").innerHTML='<div class="login"><h1><b>asa</b>local · Yönetim</h1><p>Yönetici hesabınla giriş yap</p>'
   +'<input id="le" type="email" placeholder="E-posta" autocomplete="username">'
   +'<input id="lp" type="password" placeholder="Şifre" autocomplete="current-password">'
   +'<div class="err" id="aerr">'+esc(msg||"")+'</div>'
   +'<button class="btn primary" id="abtn" style="width:100%">Giriş</button>'
   +'<div class="hint">Yalnız Supabase hesabı olan ve admin rolü verilmiş kişiler erişebilir.</div></div>';
  const submit=async()=>{
    const email=($("le").value||"").trim(), pw=$("lp").value||"";
    if(!email||!pw){ $("aerr").textContent="E-posta ve şifre gerekli."; return; }
    $("abtn").disabled=true; $("abtn").textContent="Giriş yapılıyor…";
    const {error}=await authClient.auth.signInWithPassword({email, password:pw});
    if(error){ $("aerr").textContent="Giriş başarısız. Bilgileri kontrol et."; $("abtn").disabled=false; $("abtn").textContent="Giriş"; return; }
    bootGate();
  };
  $("abtn").onclick=submit;
  $("lp").onkeydown=e=>{ if(e.key==="Enter")submit(); };
  $("le").onkeydown=e=>{ if(e.key==="Enter")$("lp").focus(); };
}

async function loadCaps(){
  const rc=async(fn)=>{ try{ const {data}=await authClient.rpc(fn); return data===true; }catch(e){ return false; } };
  CAPS.admin=await rc('is_current_user_admin');
  if(!CAPS.admin){ resetCaps(); return; }
  CAPS.venues=await rc('_can_edit_venues');  CAPS.cities=await rc('_can_edit_cities');
  CAPS.content=await rc('_can_edit_content'); CAPS.ads=await rc('_can_edit_ads');
  CAPS.moderate=await rc('_can_moderate');    CAPS.members=await rc('_can_manage_members');
  try{ const {data}=await authClient.rpc('current_user_has_admin_role',{role_name:'super_admin'}); CAPS.superadmin=(data===true); }catch(e){ CAPS.superadmin=false; }
}

async function bootGate(){
  let session=null; try{ const r=await authClient.auth.getSession(); session=r.data.session; }catch(e){}
  if(!session){ renderLogin(); return; }
  $("app").innerHTML='<div class="login"><p class="muted" style="padding:24px">Yetki kontrol ediliyor…</p></div>';
  await loadCaps();
  if(!CAPS.admin){
    $("app").innerHTML='<div class="login"><h1><b>asa</b>local · Yönetim</h1><p>Bu panele erişim yetkiniz yok.</p>'
     +'<div class="hint">Hesabınız aktif admin rolüne sahip değil. Yetki için sistem yöneticisiyle görüşün.</div>'
     +'<button class="btn" id="lo2" style="width:100%;margin-top:14px">Çıkış</button></div>';
    $("lo2").onclick=async()=>{ try{await authClient.auth.signOut();}catch(e){} resetCaps(); renderLogin(); };
    return;
  }
  boot();
}

/* ---------- admin-api (privileged, Auth JWT) ---------- */
async function isPrivAuthed(){ try{ const {data:{session}}=await authClient.auth.getSession(); return !!session; }catch(e){ return false; } }
async function adminApi(action, params){
  try{
    const {data:{session}}=await authClient.auth.getSession();
    if(!session) return {status:401, body:{error:"no_session"}};
    const res=await fetch(FN_URL,{ method:"POST", cache:"no-store",
      headers:{"Content-Type":"application/json","apikey":CFG.key,"Authorization":"Bearer "+session.access_token},
      body:JSON.stringify({action, params:params||{}}) });
    let body=null; try{ body=await res.json(); }catch(e){}
    return {status:res.status, body};
  }catch(e){ return {status:0, body:{error:"network"}}; } // hata mesajında PII yok; console'a yazma yok
}
function apiErrText(status){
  if(status===401) return "Oturum gerekli — yönetici olarak tekrar giriş yap.";
  if(status===403) return "Bu veriye erişim yetkiniz yok.";
  if(status===409) return "İşlem çakışması — sayfayı yenileyip tekrar deneyin.";
  if(status===429) return "Çok fazla istek — kısa süre bekleyip tekrar dene.";
  if(status===503) return "Admin servisi geçici olarak kapalı.";
  if(status===0)   return "Ağ hatası — bağlantını kontrol et.";
  return "Beklenmeyen hata ("+status+").";
}
function privLoginHTML(hint){
  return '<div class="panel" style="max-width:440px"><h3 style="margin-bottom:6px">Yönetici girişi (Supabase)</h3>'
   +'<p class="muted" style="margin-bottom:12px">Üye ve seyahat verileri güvenli admin veri katmanından gelir; super_admin/support girişi gerekir.</p>'
   +'<div class="fld" style="margin-bottom:8px"><label>E-posta</label><input id="pa_email" type="email" autocomplete="username"></div>'
   +'<div class="fld" style="margin-bottom:8px"><label>Şifre</label><input id="pa_pw" type="password" autocomplete="current-password"></div>'
   +'<div class="err" id="pa_err">'+esc(hint||"")+'</div>'
   +'<button class="btn primary" id="pa_btn" style="width:100%">Giriş yap</button></div>';
}
function wirePrivLogin(after){
  $("pa_btn").onclick=async()=>{
    const email=($("pa_email").value||"").trim(), pw=$("pa_pw").value||"";
    if(!email||!pw){ $("pa_err").textContent="E-posta ve şifre gerekli."; return; }
    $("pa_btn").disabled=true; $("pa_btn").textContent="Giriş yapılıyor…";
    const {error}=await authClient.auth.signInWithPassword({email, password:pw});
    if(error){ $("pa_err").textContent="Giriş başarısız. Bilgileri kontrol et."; $("pa_btn").disabled=false; $("pa_btn").textContent="Giriş yap"; return; }
    after();
  };
  $("pa_pw").onkeydown=e=>{ if(e.key==="Enter")$("pa_btn").click(); };
}

async function loadAll(){
  // Yalnız PUBLIC tablolar (mevcut sekmeler). members/trips artık admin-api'den gelir.
  try{ const {data}=await db.from("venues").select("*").order("name"); DATA.venues=data||[]; }catch(e){}
  try{ const {data}=await db.from("cities").select("*").order("name"); DATA.cities=data||[]; }catch(e){}
  try{ const {data}=await db.from("comments").select("*").order("created_at",{ascending:false}); DATA.comments=data||[]; }catch(e){}
  try{ const {data}=await db.from("ads").select("*").order("id"); DATA.ads=data||[]; }catch(e){}
  try{ const {data}=await db.from("site_content").select("*").order("key"); DATA.content=data||[]; }catch(e){}
}

function shell(body){
  $("app").innerHTML=
   '<div class="topbar"><div><div class="b"><b>asa</b>local · Yönetim</div><div class="s">Merkezi kontrol paneli</div></div><button class="logout" id="lo">Çıkış</button></div>'
   +'<div class="wrap"><div class="nav" id="nav"></div><div id="body"></div></div>';
  $("lo").onclick=async()=>{ try{await authClient.auth.signOut();}catch(e){} resetCaps(); seg="ozet"; renderLogin(); };
  const segs=[["ozet","Özet"]];
  if(CAPS.venues){ segs.push(["venues","Mekanlar"]); segs.push(["tags","Etiketler"]); }
  if(CAPS.cities)   segs.push(["cities","Şehirler"]);
  if(CAPS.cities)   segs.push(["dhealth","Veri Sağlığı"]);
  if(CAPS.content)  segs.push(["content","İçerik"]);
  if(CAPS.ads)      segs.push(["ads","Reklamlar"]);
  if(CAPS.moderate) segs.push(["comments","Moderasyon"]);
  if(CAPS.members)  segs.push(["members","Üyeler"]);
  if(CAPS.superadmin) segs.push(["changelog","Değişiklik Günlüğü"]);
  if(!segs.some(s=>s[0]===seg)) seg=segs[0][0];
  $("nav").innerHTML=segs.map(s=>'<button class="'+(seg===s[0]?"on":"")+'" onclick="go(\''+s[0]+'\')">'+s[1]+'</button>').join("");
  $("body").innerHTML=body;
}
function go(s){ seg=s; render(); }
function render(){
  const need={venues:'venues',tags:'venues',cities:'cities',dhealth:'cities',content:'content',ads:'ads',comments:'moderate',members:'members',changelog:'superadmin'};
  if(need[seg] && !CAPS[need[seg]]) seg='ozet';   // yetkisiz sekme → Özet (UI koruması; RLS/sunucu asıl kapı)
  if(seg==="ozet") return renderOzet();
  if(seg==="venues") return renderVenues();
  if(seg==="cities") return renderCities();
  if(seg==="tags") return renderTags();
  if(seg==="content") return renderContent();
  if(seg==="comments") return renderComments();
  if(seg==="ads") return renderAds();
  if(seg==="members") return renderMembers();
  if(seg==="changelog") return renderChangeLog();
  if(seg==="dhealth") return renderDataHealth();
}
function stat(n,l){ return '<div class="stat"><b>'+esc(n)+'</b><span>'+esc(l)+'</span></div>'; }

/* ---------- ÖZET (dashboard) — counts action ---------- */
async function renderOzet(){
  const v=DATA.venues, act=v.filter(x=>x.active).length, ck=v.filter(x=>x.conf==="low").length;
  const staticCards='<div class="cards">'+stat(v.length,"Mekan")+stat(act,"Aktif mekan")
    +stat(DATA.cities.filter(c=>c.status==="active").length+"/"+DATA.cities.length,"Aktif/Toplam şehir")
    +stat(DATA.ads.filter(a=>a.active).length,"Aktif reklam")+stat(ck,"Kontrol gereken")+'</div>';
  const skel='<div class="cards">'+Array(6).fill('<div class="stat skel" style="height:64px"></div>').join("")+'</div>';
  shell('<div id="ozetBody">'+staticCards+skel+'</div>');
  if(!(await isPrivAuthed())){ $("ozetBody").innerHTML=staticCards+privLoginHTML(); wirePrivLogin(()=>renderOzet()); return; }
  const r=await adminApi("counts",{});
  if(r.status===401){ $("ozetBody").innerHTML=staticCards+privLoginHTML("Oturum sona erdi, tekrar giriş yap."); wirePrivLogin(()=>renderOzet()); return; }
  if(r.status!==200){
    $("ozetBody").innerHTML=staticCards+'<div class="notice err">'+esc(apiErrText(r.status))+' <button class="btn sm" onclick="renderOzet()">Tekrar dene</button></div>';
    return;
  }
  const c=(r.body&&r.body.data)||{}; const n=x=>(x==null?"—":x);
  $("ozetBody").innerHTML=staticCards
    +'<div class="cards">'
    +stat(n(c.users),"Kullanıcı")+stat(n(c.members),"Üye profili")+stat(n(c.trips_total),"Toplam seyahat")
    +stat(n(c.trips_draft),"Taslak")+stat(n(c.trips_upcoming),"Yaklaşan")+stat(n(c.trips_active),"Aktif")
    +stat(n(c.trips_past),"Geçmiş")+stat(n(c.trips_archived),"Arşiv")
    +stat(n(c.favorites),"Favori")+stat(n(c.comments),"Yorum")+stat(n(c.point_events),"Puan olayı")
    +'</div><div class="panel"><p class="muted">Kullanıcı/üye/seyahat sayıları güvenli admin veri katmanından (canlı) gelir.</p></div>';
}

/* ---------- MEKANLAR (değiştirilmedi) ---------- */
let vFilter={q:"",city:"",active:""};
function renderVenues(){
  const cities=[...new Set(DATA.venues.map(v=>v.city))];
  let list=DATA.venues.filter(v=>{
    if(vFilter.city&&v.city!==vFilter.city)return false;
    if(vFilter.active==="1"&&!v.active)return false;
    if(vFilter.active==="0"&&v.active)return false;
    if(vFilter.q){ const q=vFilter.q.toLowerCase(); if(!((v.name||"").toLowerCase().includes(q)||(v.area||"").toLowerCase().includes(q)||(v.tags||[]).join(",").toLowerCase().includes(q)||(v.type||"").toLowerCase().includes(q)))return false; }
    return true;
  });
  const body='<div class="panel"><div class="toolbar">'
    +'<input class="search" id="vq" placeholder="Ara: ad, semt, etiket, tür…" value="'+esc(vFilter.q)+'">'
    +'<select id="vcity"><option value="">Tüm şehirler</option>'+cities.map(c=>'<option'+(vFilter.city===c?" selected":"")+'>'+esc(c)+'</option>').join("")+'</select>'
    +'<select id="vact"><option value="">Hepsi</option><option value="1"'+(vFilter.active==="1"?" selected":"")+'>Aktif</option><option value="0"'+(vFilter.active==="0"?" selected":"")+'>Pasif</option></select>'
    +'<button class="btn primary" onclick="editVenue(null)">+ Yeni mekan</button>'
    +'<span class="muted">'+list.length+' / '+DATA.venues.length+'</span></div>'
    +'<div class="tablewrap"><table><thead><tr><th>Ad</th><th>Şehir · Semt</th><th>Tür</th><th>Etiketler</th><th>Saat</th><th>Durum</th><th></th></tr></thead><tbody>'
    +list.map(v=>'<tr>'
      +'<td><b>'+esc(v.name)+'</b>'+(v.conf==="low"?' <span class="pill soon">kontrol</span>':'')+(v.sponsored?' <span class="pill sp">sponsor</span>':'')+'</td>'
      +'<td>'+esc(v.city)+'<div class="muted">'+esc(v.area||"")+'</div></td>'
      +'<td>'+esc(v.type||"")+'</td>'
      +'<td class="muted">'+esc((v.tags||[]).join(", "))+'</td>'
      +'<td class="muted">'+esc(v.hours||"")+'</td>'
      +'<td>'+(v.active?'<span class="pill on">aktif</span>':'<span class="pill off">pasif</span>')+'</td>'
      +'<td style="white-space:nowrap"><button class="btn sm" onclick="editVenue(\''+esc(v.id)+'\')">Düzenle</button> <button class="btn sm" onclick="toggleVenue(\''+esc(v.id)+'\')">'+(v.active?"Pasifle":"Aktifle")+'</button></td>'
      +'</tr>').join("")
    +'</tbody></table></div></div>';
  shell(body);
  $("vq").oninput=()=>{vFilter.q=$("vq").value; renderVenues(); $("vq").focus(); const el=$("vq"); el.setSelectionRange(el.value.length,el.value.length);};
  $("vcity").onchange=()=>{vFilter.city=$("vcity").value; renderVenues();};
  $("vact").onchange=()=>{vFilter.active=$("vact").value; renderVenues();};
}
function venueById(id){ return DATA.venues.find(v=>v.id===id); }
function editVenue(id){
  const v=id?venueById(id):{id:"",city:"Amsterdam",active:true,garden:false,walk_in:false,work:false,sponsored:false,tags:[],cats:[],best:[]};
  const isNew=!id;
  const f=(k,l,val,type)=>'<div class="fld"><label>'+l+'</label><input id="f_'+k+'" '+(type?'type="'+type+'"':'')+' value="'+esc(val)+'"></div>';
  const ta=(k,l,val)=>'<div class="fld" style="flex:1 1 100%"><label>'+l+'</label><textarea id="f_'+k+'">'+esc(val)+'</textarea></div>';
  const chk=(k,l,val)=>'<div class="fld check"><input type="checkbox" id="f_'+k+'" '+(val?"checked":"")+'><label>'+l+'</label></div>';
  const self=(k,l,val,opts)=>'<div class="fld"><label>'+l+'</label><select id="f_'+k+'">'+opts.map(o=>'<option'+(val===o?" selected":"")+'>'+o+'</option>').join("")+'</select></div>';
  $("sheet").innerHTML='<h2>'+(isNew?"Yeni mekan":"Mekanı düzenle")+'</h2>'
    +'<div class="frow">'+f("id","ID (kısa, benzersiz)",v.id)+f("name","Ad",v.name||"")+'</div>'
    +'<div class="frow">'+f("city","Şehir",v.city||"")+f("area","Semt",v.area||"")+f("type","Tür",v.type||"")+'</div>'
    +'<div class="frow">'+f("tags","Etiketler (virgülle)",(v.tags||[]).join(", "))+'</div>'
    +'<div class="frow">'+f("cats","Kategoriler (virgülle)",(v.cats||[]).join(", "))+f("best","Best (virgülle)",(v.best||[]).join(", "))+'</div>'
    +'<div class="frow">'+f("hours","Çalışma saatleri",v.hours||"")+self("resv","Rezervasyon",v.resv||"unknown",["no","rec","req","unknown"])+self("conf","Güven",v.conf||"high",["high","med","low"])+'</div>'
    +'<div class="frow">'+f("lat","Enlem (lat)",v.lat==null?"":v.lat)+f("lng","Boylam (lng)",v.lng==null?"":v.lng)+f("src","Kaynak",v.src||"")+'</div>'
    +'<div class="frow">'+f("web","Web",v.web||"")+f("ig","Instagram",v.ig||"")+'</div>'
    +'<div class="fld" style="flex:1 1 100%"><label>Fotoğraf (boşsa kategori görseli kullanılır)</label>'
      +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
        +'<input id="f_photo_url" value="'+esc(v.photo_url||"")+'" oninput="venuePhotoPrev()" placeholder="Foto URL (veya soldan yükle)" style="flex:1;min-width:220px">'
        +'<label class="btn" style="cursor:pointer">Fotoğraf yükle<input type="file" accept="image/*" hidden onchange="venuePhotoUpload(event)"></label>'
        +'<span id="f_upmsg" class="muted" style="font-size:12px"></span>'
      +'</div>'
      +'<div id="vPhotoPrev" style="margin-top:8px"></div></div>'
    +ta("tip","Yerli tüyosu (tip)",v.tip||"")
    +ta("description","Açıklama",v.description||"")
    +ta("note","Not",v.note||"")
    +'<div class="frow">'+chk("garden","Bahçeli / dış mekan",v.garden)+chk("walk_in","Rezervasyonsuz girilebilir",v.walk_in)+chk("work","Çalışmaya uygun",v.work)+chk("sponsored","Sponsorlu",v.sponsored)+chk("active","Aktif (yayında)",v.active)+'</div>'
    +'<div class="err" id="verr"></div>'
    +'<div class="foot"><button class="btn" onclick="closeModal()">Vazgeç</button>'+(isNew?"":'<button class="btn danger" onclick="delVenue(\''+esc(v.id)+'\')">Sil</button>')+'<button class="btn primary" id="vsave">Kaydet</button></div>';
  openModal();
  try{venuePhotoPrev();}catch(e){}
  $("vsave").onclick=()=>saveVenue(isNew);
}
async function saveVenue(isNew){
  const g=k=>{const e=$("f_"+k);return e?e.value:"";};
  const gc=k=>{const e=$("f_"+k);return e?e.checked:false;};
  const id=g("id").trim();
  if(!id||!g("name").trim()){ $("verr").textContent="ID ve Ad zorunlu."; return; }
  const row={id, name:g("name").trim(), city:g("city").trim()||"Amsterdam", area:g("area").trim(), type:g("type").trim(),
    tags:arr(g("tags")), cats:arr(g("cats")), best:arr(g("best")), hours:g("hours").trim()||null,
    resv:g("resv"), conf:g("conf"), src:g("src").trim()||null, web:g("web").trim()||null, ig:g("ig").trim()||null, photo_url:g("photo_url").trim()||null,
    tip:g("tip").trim()||null, description:g("description").trim()||null, note:g("note").trim()||null,
    lat:g("lat")?parseFloat(g("lat")):null, lng:g("lng")?parseFloat(g("lng")):null,
    garden:gc("garden"), walk_in:gc("walk_in"), work:gc("work"), sponsored:gc("sponsored"), active:gc("active"),
    updated_at:new Date().toISOString()};
  const btn=$("vsave"); btn.disabled=true; btn.textContent="Kaydediliyor…";
  try{ const {error}=await db.from("venues").upsert(row,{onConflict:"id"}); if(error)throw error; }catch(e){ $("verr").textContent="Hata: "+(e.message||e); btn.disabled=false; btn.textContent="Kaydet"; return; }
  const i=DATA.venues.findIndex(x=>x.id===id); if(i>=0)DATA.venues[i]=Object.assign(DATA.venues[i],row); else DATA.venues.push(row);
  closeModal(); renderVenues();
}
function venuePhotoPrev(){ const el=$("vPhotoPrev"); if(!el)return; const u=($("f_photo_url").value||"").trim(); el.innerHTML=u?'<img src="'+esc(u)+'" style="max-height:140px;border-radius:6px;border:1px solid #ddd" onerror="this.parentNode.innerHTML=\'<span style=color:#a33;font-size:12px>Görsel yüklenemedi — link doğrudan bir görsel dosyası mı?</span>\'">':''; }
async function venuePhotoUpload(ev){ const file=ev.target.files&&ev.target.files[0]; if(!file)return; const msg=$("f_upmsg"); if(msg)msg.textContent="Yükleniyor…"; try{ const url=await uploadToMedia(file,"venues"); $("f_photo_url").value=url; venuePhotoPrev(); if(msg)msg.textContent="✓ yüklendi"; }catch(e){ if(msg)msg.textContent="Hata: "+(e.message||e); } }
async function toggleVenue(id){ const v=venueById(id); if(!v)return; const na=!v.active; try{ await db.from("venues").update({active:na,updated_at:new Date().toISOString()}).eq("id",id); v.active=na; }catch(e){} renderVenues(); }
async function delVenue(id){ if(!confirm("Bu mekanı silmek istediğine emin misin?"))return; try{ await db.from("venues").delete().eq("id",id); }catch(e){} DATA.venues=DATA.venues.filter(v=>v.id!==id); closeModal(); renderVenues(); }

/* ---------- ŞEHİRLER (değiştirilmedi) ---------- */
function renderCities(){
  const body='<div class="panel"><div class="toolbar"><button class="btn primary" onclick="editCity(null)">+ Yeni şehir</button></div>'
    +'<div class="tablewrap"><table><thead><tr><th>Şehir</th><th>Ülke</th><th>Durum</th><th>Mekan</th><th></th></tr></thead><tbody>'
    +DATA.cities.map(c=>{const vn=DATA.venues.filter(v=>v.city===c.name).length;return '<tr><td>'+esc(c.flag||"")+' <b>'+esc(c.name)+'</b></td><td>'+esc(c.country||"")+'</td><td><span class="pill '+(c.status==="active"?"on":(c.status==="soon"?"soon":"off"))+'">'+esc(c.status)+'</span></td><td class="muted">'+vn+'</td><td><button class="btn sm" onclick="editCity(\''+esc(c.code)+'\')">Düzenle</button></td></tr>';}).join("")
    +'</tbody></table></div></div>';
  shell(body);
}
function editCity(code){
  const c=code?DATA.cities.find(x=>x.code===code):{code:"",name:"",country:"",flag:"",status:"draft",lat:null,lng:null,zoom:null,blurb:"",cover_url:"",timezone:"",coverage_radius_km:60};
  const isNew=!code;
  const f=(k,l,val,ro)=>'<div class="fld"><label>'+l+'</label><input id="c_'+k+'" value="'+esc(val==null?"":val)+'"'+(ro?' readonly style="opacity:.6;background:#f2f1ee"':'')+'></div>';
  const NL='<span class="pill" style="background:#efe7d6;color:#7c5a12;font-size:10px">canlı app\'te henüz kullanılmıyor (AOÇ-1B)</span>';
  $("sheet").innerHTML='<h2>'+(isNew?"Yeni şehir":"Şehri düzenle")+'</h2>'
    +'<div class="frow">'+f("code","Kod (benzersiz"+(isNew?"":", salt-okunur")+")",c.code,!isNew)+f("name","Ad",c.name)+'</div>'
    +(isNew?"":'<div class="muted" style="font-size:11px;margin:-6px 0 8px">Kod kimliktir; mevcut şehirde değiştirilemez (ayrı kontrollü migration gerektirir).</div>')
    +'<div class="frow">'+f("country","Ülke",c.country||"")+f("flag","Bayrak (emoji)",c.flag||"")+'</div>'
    +'<div class="frow"><div class="fld"><label>Durum</label><select id="c_status">'+["draft","soon","active","inactive"].map(o=>'<option'+(c.status===o?" selected":"")+'>'+o+'</option>').join("")+'</select></div></div>'
    +'<div style="border-top:1px solid var(--line);margin:10px 0 6px;padding-top:8px"><b style="font-size:13px">Harita & bağlam</b> '+NL+'</div>'
    +'<div class="frow">'+f("lat","Merkez enlem (lat)",c.lat)+f("lng","Merkez boylam (lng)",c.lng)+f("zoom","Zoom (1–22)",c.zoom)+'</div>'
    +'<div class="frow">'+f("timezone","IANA saat dilimi (örn. Europe/Berlin)",c.timezone||"")+f("coverage_radius_km","Kapsama yarıçapı (km, 1–250)",c.coverage_radius_km==null?60:c.coverage_radius_km)+'</div>'
    +'<div class="fld" style="flex:1 1 100%"><label>Blurb (şehir kısa tanıtımı)</label><textarea id="c_blurb">'+esc(c.blurb||"")+'</textarea></div>'
    +'<div class="frow">'+f("cover_url","Kapak görseli URL (yalnız https://)",c.cover_url||"")+'</div>'
    +'<div class="err" id="cerr"></div><div class="foot"><button class="btn" onclick="closeModal()">Vazgeç</button><button class="btn primary" id="csave">Kaydet</button></div>';
  openModal();
  $("csave").onclick=async()=>{
    const g=k=>($("c_"+k)?$("c_"+k).value:"");
    const code2=(isNew?g("code").trim():c.code), name=g("name").trim();
    const num=(s)=>{ s=(s||"").trim(); if(s==="")return null; const n=Number(s); return isFinite(n)?n:NaN; };
    const lat=num(g("lat")), lng=num(g("lng")), zoom=num(g("zoom")), cov=num(g("coverage_radius_km"));
    const tz=g("timezone").trim(), cover=g("cover_url").trim();
    if(!code2||!name){ $("cerr").textContent="Kod ve Ad zorunlu."; return; }
    if(isNew && !/^[a-z0-9-]{2,40}$/.test(code2)){ $("cerr").textContent="Kod: küçük harf/rakam/tire, 2–40."; return; }
    if(lat!==null&&(Number.isNaN(lat)||lat< -90||lat>90)){ $("cerr").textContent="Enlem −90..90 arası olmalı."; return; }
    if(lng!==null&&(Number.isNaN(lng)||lng< -180||lng>180)){ $("cerr").textContent="Boylam −180..180 arası olmalı."; return; }
    if(zoom!==null&&(Number.isNaN(zoom)||zoom<1||zoom>22||zoom%1!==0)){ $("cerr").textContent="Zoom 1–22 tam sayı olmalı."; return; }
    if(cov!==null&&(Number.isNaN(cov)||cov<1||cov>250||cov%1!==0)){ $("cerr").textContent="Kapsama 1–250 km tam sayı olmalı."; return; }
    if(cover&&!/^https:\/\//i.test(cover)){ $("cerr").textContent="Kapak URL yalnız https:// olabilir."; return; }
    if(tz&&!/^[A-Za-z]+\/[A-Za-z0-9_+\-\/]+$/.test(tz)){ $("cerr").textContent="Saat dilimi biçimi geçersiz (örn. Europe/Berlin). Sunucu ayrıca doğrular."; return; }
    const row={code:code2,name:name,country:g("country").trim(),flag:g("flag").trim(),status:g("status"),
      lat:lat,lng:lng,zoom:zoom,blurb:g("blurb").trim()||null,cover_url:cover||null,timezone:tz||null,
      coverage_radius_km:(cov==null?60:cov),updated_at:new Date().toISOString()};
    const btn=$("csave"); btn.disabled=true; btn.textContent="Kaydediliyor…";
    try{ const {error}=await db.from("cities").upsert(row,{onConflict:"code"}); if(error)throw error; }
    catch(e){ const m=(e.message||e)+""; $("cerr").textContent = m.includes("invalid_timezone")?"Sunucu: geçersiz saat dilimi.":(m.includes("chk_cities")||m.includes("code_immutable")?"Sunucu doğrulaması reddetti: "+m:"Hata: "+m); btn.disabled=false; btn.textContent="Kaydet"; return; }
    const i=DATA.cities.findIndex(x=>x.code===code2); if(i>=0)DATA.cities[i]=Object.assign(DATA.cities[i],row); else DATA.cities.push(row);
    closeModal(); renderCities();
  };
}

/* ---------- AOÇ-1: VERİ SAĞLIĞI (salt-okunur teşhis) ---------- */
let DH={city:""};
function renderDataHealth(){
  const cityNames=DATA.cities.map(c=>c.name).sort((a,b)=>a.localeCompare(b,'tr'));
  const b='<div class="panel"><h3 style="margin-bottom:6px">Veri Sağlığı (salt-okunur teşhis)</h3><p class="muted" style="margin-bottom:10px">Şehir seç → sunucu sayımları + karar motoru havuzları (motorla birebir). Otomatik düzeltme/CSV yok; her uyarı editöre yönlendirir.</p>'
    +'<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><select id="dhCity"><option value="">— şehir seç —</option>'+cityNames.map(n=>'<option'+(DH.city===n?' selected':'')+'>'+esc(n)+'</option>').join("")+'</select><button class="btn sm primary" onclick="dhLoad()">Kontrol et</button></div>'
    +'<div id="dhBody"><p class="muted">Bir şehir seçip "Kontrol et"e bas. (Henüz kontrol edilmedi.)</p></div></div>';
  shell(b);
  if(DH.city) setTimeout(dhLoad,50);
}
async function dhLoad(){
  const sel=$("dhCity"); if(sel)DH.city=sel.value;
  const box=$("dhBody"); if(!box)return;
  if(!DH.city){ box.innerHTML='<p class="muted">Önce şehir seç.</p>'; return; }
  box.innerHTML='<p class="muted">Yükleniyor…</p>';
  const r=await adminApi("city_health",{city:DH.city});
  if(r.status!==200){ box.innerHTML='<div class="notice err">Veri alınamadı: '+esc(apiErrText(r.status))+' <button class="btn sm" onclick="dhLoad()">Tekrar</button></div>'; return; }
  const d=(r.body&&r.body.data)||{}; const cs=d.city_settings||{}, cnt=d.counts||{}, vs=d.venues||[];
  const okC=await ensureContract();
  if(!okC || !window.DecisionContract){ box.innerHTML='<div class="notice err">Motor sözleşmesi (/decision_contract.js) yüklenemedi — sağlık teşhisi üretilemiyor (fail-closed). decision_contract.js yayınlandı mı?</div>'; return; }
  cnt.unparseable_hours = vs.filter(function(v){ return v.hours && String(v.hours).trim()!=='' && window.DecisionContract.parseHours(v.hours)===null; }).length;  // motorla birebir (SQL regex değil)
  let h='', anyIssue=false;
  h+='<div class="cards">'+stat(cnt.venues_total||0,"Mekan")+stat(cnt.venues_active||0,"Aktif")+stat(cnt.venues_inactive||0,"Pasif")+stat(cs.settings_complete?"✓":"eksik","Şehir ayarı")+'</div>';
  if(!cs.city_exists){ anyIssue=true; h+='<div class="notice warn">Bu isimde cities kaydı yok (mekanlar var ama şehir tanımı eksik). Şehir editöründen ekleyin.</div>'; }
  else if(!cs.settings_complete){
    const miss=[['lat',cs.lat],['lng',cs.lng],['zoom',cs.zoom],['timezone',cs.timezone]].filter(x=>x[1]==null).map(x=>x[0]).join(", ");
    const editBtn=' <button class="btn sm" onclick="editCityByName(\''+esc(DH.city).replace(/'/g,"\\'")+'\')">Şehri düzenle</button>';
    if(cs.status==='active'){ anyIssue=true; h+='<div class="notice warn"><b>Yayında ama ayar eksik:</b> '+esc(miss)+editBtn+'</div>'; }
    else { h+='<div class="notice" style="background:#eef3fa;border-color:#b3c7e6">Şehir henüz yayında değil ('+esc(cs.status||'—')+'); açılmadan önce tamamlanmalı: '+esc(miss)+editBtn+'</div>'; }
  }
  const RULES=[['missing_coord','Koordinatsız mekan','high'],['invalid_coord','Geçersiz koordinat','high'],['out_of_coverage','Kapsama dışı pin ('+(cs.coverage_radius_km||60)+' km)','med'],['missing_cats','Kategori yok','med'],['missing_tags','Etiket yok','med'],['missing_best','Best yok','med'],['missing_hours','Saat yok','low'],['unparseable_hours','Ayrıştırılamayan saat','low'],['missing_photo','Foto yok','low'],['missing_description','Açıklama yok','low'],['conf_low','Güven düşük','med']];
  const rows=RULES.map(function(r){ const v=cnt[r[0]]; if(v==null)return '<tr><td>'+esc(r[1])+'</td><td class="muted">kontrol edilmedi</td><td></td></tr>'; if(v>0)anyIssue=true; const cls=r[2]==='high'?'off':(r[2]==='med'?'soon':'muted'); return '<tr><td>'+esc(r[1])+'</td><td>'+(v>0?'<span class="pill '+cls+'">'+v+'</span>':'<span class="pill on">0</span>')+'</td><td>'+(v>0?'<button class="btn sm" onclick="dhGoVenues(\''+esc(DH.city).replace(/'/g,"\\'")+'\')">Mekanlar</button>':'')+'</td></tr>'; }).join("");
  h+='<div style="margin-top:12px"><b>Veri kalitesi</b><div class="tablewrap"><table><thead><tr><th>Kural</th><th>Sayı</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  const empties=DecisionContract.modePoolEmpty(vs,DH.city);
  const cells=DecisionContract.healthCells(vs,DH.city);
  let poolH='';
  if(empties.length){ anyIssue=true; poolH+='<div class="notice warn">Karar havuzu BOŞ mod(lar): '+empties.map(e=>esc(e.mode)).join(", ")+' — bu modda hiç uygun mekan yok.</div>'; }
  if(cells.filter(c=>c.cls==='core'&&(c.severity==='critical'||c.severity==='weak')).length) anyIssue=true;
  poolH+='<div class="tablewrap"><table><thead><tr><th>Mod</th><th>Zaman</th><th>Uygun</th><th>Durum</th></tr></thead><tbody>'
    +cells.map(c=>'<tr><td>'+esc(c.mode)+'</td><td>'+esc(c.slot)+'</td><td>'+c.count+'</td><td>'+dhSev(c.severity)+(c.cls==='optional'?' <span class="muted" style="font-size:10px">(dar)</span>':'')+'</td></tr>').join("")
    +'</tbody></table></div>';
  h+='<div style="margin-top:12px"><b>Karar motoru havuzları (motorla birebir)</b> <span class="muted" style="font-size:11px">0–2 kritik · 3–4 zayıf · 5+ yeterli; beklenmeyen (na) hücreler hariç</span>'+poolH+'</div>';
  if(!anyIssue) h='<div class="notice" style="background:#e8f5e9;border-color:#a5d6a7">✓ '+esc(DH.city)+' için sorun bulunamadı (0 sorun).</div>'+h;
  box.innerHTML=h;
}
function dhSev(s){ if(s==='critical')return '<span class="pill off">kritik</span>'; if(s==='weak')return '<span class="pill soon">zayıf</span>'; if(s==='info')return '<span class="pill muted">info</span>'; return '<span class="pill on">yeterli</span>'; }
function dhGoVenues(city){ vFilter={q:"",city:city,active:""}; seg="venues"; render(); }
function editCityByName(name){ const c=DATA.cities.find(x=>x.name===name); if(c){ seg="cities"; render(); setTimeout(()=>editCity(c.code),60);} }

/* ---------- ETIKETLER (değiştirilmedi) ---------- */
let openTag=null;
function renderTags(){
  const map={}; DATA.venues.forEach(v=>(v.tags||[]).forEach(t=>{map[t]=(map[t]||0)+1;}));
  const rows=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const body='<div class="panel"><h3 style="margin-bottom:10px">Etiketler ('+rows.length+')</h3><p class="muted" style="margin-bottom:12px">Bir etikete tıkla → o etiketteki mekanlar açılır; oradan düzenle ya da etiketi mekandan kaldır.</p>'
    +'<div class="acc">'+rows.map(r=>{
      const t=r[0], open=(openTag===t);
      let inner='';
      if(open){
        const vs=DATA.venues.filter(v=>(v.tags||[]).indexOf(t)>-1).sort((a,b)=>(a.name||"").localeCompare(b.name||"","tr"));
        inner='<div class="accbody">'+vs.map(v=>'<div class="accrow"><span><b>'+esc(v.name)+'</b> <span class="muted">· '+esc(v.city||"")+(v.area?" · "+esc(v.area):"")+'</span></span>'
          +'<span style="white-space:nowrap"><button class="btn sm" onclick="editVenue(\''+esc(v.id)+'\')">Düzenle</button> <button class="btn sm danger" onclick="removeTag(\''+esc(v.id)+'\',\''+esc(t)+'\')">Etiketi kaldır</button></span></div>').join("")+'</div>';
      }
      return '<div class="accitem"><div class="acchead" style="cursor:pointer" onclick="toggleTag(\''+esc(t)+'\')"><span>'+(open?"▾":"▸")+' <b>'+esc(t)+'</b></span><span class="pill">'+r[1]+' mekan</span></div>'+inner+'</div>';
    }).join("")+'</div></div>';
  shell(body);
}
function toggleTag(t){ openTag=(openTag===t?null:t); renderTags(); }
async function removeTag(id,t){
  const v=venueById(id); if(!v)return;
  const nt=(v.tags||[]).filter(x=>x!==t);
  try{ await db.from("venues").update({tags:nt,updated_at:new Date().toISOString()}).eq("id",id); }catch(e){ alert("Hata: "+(e.message||e)); return; }
  v.tags=nt; renderTags();
}

let modState={city:"",venue:"",visibility:"all",limit:25,offset:0,total:0,has_more:false};
let modTimer=null;
async function renderComments(){
  if(!(await isPrivAuthed())){ shell(privLoginHTML()); wirePrivLogin(()=>renderComments()); return; }
  shell('<div class="panel"><div class="toolbar">'
    +'<select id="cvis"><option value="all"'+(modState.visibility==="all"?" selected":"")+'>Tümü</option><option value="visible"'+(modState.visibility==="visible"?" selected":"")+'>Görünür</option><option value="hidden"'+(modState.visibility==="hidden"?" selected":"")+'>Gizli</option></select>'
    +'<input class="search" id="ccity" placeholder="Şehir (opsiyonel)" value="'+esc(modState.city)+'">'
    +'<input class="search" id="cvenue" placeholder="Mekan ID (opsiyonel)" value="'+esc(modState.venue)+'">'
    +'<button class="btn sm" id="crefresh">Yenile</button><span class="muted" id="ccount"></span></div>'
    +'<div id="modResults"><p class="muted">Yükleniyor…</p></div>'
    +'<div id="modPager" style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"></div>'
    +'<div class="hint">Gizleme yorumu SİLMEZ; puan ve beğeniler korunur, yalnız herkese açık görünürlük kalkar. Yalnız super_admin/moderator.</div></div>');
  $("cvis").onchange=()=>{ modState.visibility=$("cvis").value; modState.offset=0; loadModerationPage(); };
  $("ccity").oninput=()=>{ modState.city=$("ccity").value; clearTimeout(modTimer); modTimer=setTimeout(()=>{modState.offset=0;loadModerationPage();},350); };
  $("cvenue").oninput=()=>{ modState.venue=$("cvenue").value; clearTimeout(modTimer); modTimer=setTimeout(()=>{modState.offset=0;loadModerationPage();},350); };
  $("crefresh").onclick=()=>{ modState.offset=0; loadModerationPage(); };
  loadModerationPage();
}
async function loadModerationPage(){
  const rEl=$("modResults"), pEl=$("modPager"), cEl=$("ccount");
  if(!rEl) return;
  const params={ visibility:modState.visibility, limit:modState.limit, offset:modState.offset };
  if(modState.city.trim()) params.city=modState.city.trim();
  if(modState.venue.trim()) params.venue=modState.venue.trim();
  rEl.innerHTML='<p class="muted">Yükleniyor…</p>';
  const r=await adminApi("comment_search", params);
  if(r.status===401){ shell(privLoginHTML("Oturum sona erdi.")); wirePrivLogin(()=>renderComments()); return; }
  if(r.status===403){ rEl.innerHTML='<div class="notice err">Bu alana erişim yetkiniz yok (moderator/super_admin gerekir).</div>'; pEl.innerHTML=""; cEl.textContent=""; return; }
  if(r.status!==200){ rEl.innerHTML='<div class="notice err">'+esc(apiErrText(r.status))+'</div>'; pEl.innerHTML=""; cEl.textContent=""; return; }
  const d=(r.body&&r.body.data)||{total:0,rows:[],has_more:false};
  modState.total=d.total||0; modState.has_more=!!d.has_more;
  const rows=d.rows||[];
  cEl.textContent=modState.total+' yorum';
  if(!rows.length){ rEl.innerHTML='<p class="muted">Sonuç yok.</p>'; }
  else{
    rEl.innerHTML='<div class="tablewrap"><table><thead><tr><th>Üye</th><th>E-posta</th><th>Mekan</th><th>Şehir</th><th>Yorum</th><th>Durum</th><th>Tarih</th><th></th></tr></thead><tbody>'
     +rows.map(c=>{
        const lbl=(c.venue_id||"")+" · "+((c.body||"").slice(0,60));
        return '<tr>'
          +'<td>'+esc(c.display_name||"Üye")+'</td>'
          +'<td class="muted">'+esc(c.email_masked||"—")+'</td>'
          +'<td class="muted">'+esc(c.venue_id||"—")+'</td>'
          +'<td class="muted">'+esc(c.city||"—")+'</td>'
          +'<td style="max-width:320px;word-break:break-word">'+esc((c.body||"").slice(0,300))+'</td>'
          +'<td>'+(c.hidden?'<span class="pill off">gizli</span>':'<span class="pill on">görünür</span>')+'</td>'
          +'<td class="muted">'+fmtDate(c.created_at)+'</td>'
          +'<td><button class="btn sm '+(c.hidden?"":"danger")+' mod-hide" data-id="'+c.id+'" data-desired="'+(c.hidden?"0":"1")+'" data-label="'+esc(lbl)+'">'+(c.hidden?"Göster":"Gizle")+'</button></td>'
          +'</tr>';
      }).join("")+'</tbody></table></div>';
    Array.from(document.querySelectorAll(".mod-hide")).forEach(b=>{ b.onclick=()=>modHide(Number(b.dataset.id), b.dataset.desired==="1", b.dataset.label||""); });
  }
  const from=rows.length?modState.offset+1:0, to=modState.offset+rows.length;
  pEl.innerHTML='<button class="btn sm" id="cprev"'+(modState.offset<=0?" disabled":"")+'>‹ Önceki</button>'
   +'<span class="muted">'+from+'–'+to+' / '+modState.total+'</span>'
   +'<button class="btn sm" id="cnext"'+(modState.has_more?"":" disabled")+'>Sonraki ›</button>';
  if($("cprev"))$("cprev").onclick=()=>{ modState.offset=Math.max(0,modState.offset-modState.limit); loadModerationPage(); };
  if($("cnext"))$("cnext").onclick=()=>{ if(modState.has_more){ modState.offset+=modState.limit; loadModerationPage(); } };
}

/* ---------- Kontrollü yazma: onay + gerekçe diyaloğu (0C.1) ---------- */
function writeErrText(r){
  const code=(r.body&&r.body.error)||"";
  if(r.status===409&&code==="idempotency_conflict") return "İşlem çakışması — sayfayı yenileyip tekrar deneyin.";
  if(r.status===409&&code==="cannot_target_self") return "Kendi hesabını hedefleyemezsin.";
  if(r.status===409&&code==="cannot_target_admin") return "Bir yönetici hesabı hedeflenemez.";
  if(r.status===404) return "Hedef bulunamadı (profil olmayabilir).";
  if(r.status===503&&code==="writes_temporarily_disabled") return "Yazma işlemleri geçici olarak kapalı.";
  return apiErrText(r.status);
}
const WC_REASONS=[["spam","Spam"],["inappropriate","Uygunsuz içerik"],["harassment","Taciz"],["misleading","Yanıltıcı bilgi"],["user_request","Kullanıcı talebi"],["security","Güvenlik"],["other","Diğer"]];
function uuid4(){
  if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
  const b=new Uint8Array(16); crypto.getRandomValues(b);
  b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
  const h=[]; for(let i=0;i<16;i++) h.push(b[i].toString(16).padStart(2,"0"));
  return h[0]+h[1]+h[2]+h[3]+"-"+h[4]+h[5]+"-"+h[6]+h[7]+"-"+h[8]+h[9]+"-"+h[10]+h[11]+h[12]+h[13]+h[14]+h[15];
}
function openWriteConfirm(cfg){
  openModal();
  const idem=uuid4();
  $("sheet").innerHTML='<h2>'+esc(cfg.title)+'</h2>'
    +'<div class="notice'+(cfg.danger?" warn":"")+'" style="margin-bottom:12px">'+esc(cfg.actionDesc)+'<br><b>'+esc(cfg.targetDesc)+'</b></div>'
    +'<div class="fld" style="margin-bottom:8px"><label>Gerekçe (zorunlu)</label><select id="wc_reason"><option value="">— seçin —</option>'+WC_REASONS.map(x=>'<option value="'+x[0]+'">'+esc(x[1])+'</option>').join("")+'</select></div>'
    +'<div class="fld" style="margin-bottom:8px"><label>Not (isteğe bağlı, en fazla 280)</label><textarea id="wc_note" maxlength="280" placeholder="Kısa açıklama…"></textarea></div>'
    +'<div class="err" id="wc_err"></div>'
    +'<div class="foot"><button class="btn" id="wc_cancel">Vazgeç</button><button class="btn '+(cfg.danger?"danger":"primary")+'" id="wc_ok">Onayla</button></div>';
  $("wc_cancel").onclick=()=>{ closeModal(); if(cfg.onDone)cfg.onDone(false); };
  $("wc_ok").onclick=async()=>{
    const reason=$("wc_reason").value, note=($("wc_note").value||"").trim();
    if(!reason){ $("wc_err").textContent="Gerekçe seçin."; return; }
    $("wc_ok").disabled=true; $("wc_cancel").disabled=true; $("wc_ok").textContent="İşleniyor…";
    const r=await cfg.run(reason, note||null, idem);
    if(r.status===200){ closeModal(); if(cfg.onDone)cfg.onDone(true); return; }
    $("wc_err").textContent=writeErrText(r); $("wc_ok").disabled=false; $("wc_cancel").disabled=false; $("wc_ok").textContent="Onayla";
  };
}
function modHide(id, desired, label){
  openWriteConfirm({
    title: desired?"Yorumu gizle":"Yorumu göster",

    targetDesc: label, danger: !!desired,
    run:(reason,note,idem)=>adminApi("comment_set_hidden",{target:id,desired:desired,reason:reason,note:note,idempotency_key:idem}),

function contentRow(key){ return DATA.content.find(c=>c.key===key); }
function renderContent(){
  const keys=Object.keys(CONTENT_DEFAULTS);
  let body='<div class="panel"><h3 style="margin-bottom:6px">Site metinleri</h3><p class="muted" style="margin-bottom:14px">Başlık/metin/buton adlarını buradan değiştir. Boş bırakırsan varsayılan metin kullanılır.</p>';
  body+=keys.map(k=>{
    const r=contentRow(k)||{}; const label=(r.label||k); const val=r.value||""; const en=(r.enabled!==false);
    const def=CONTENT_DEFAULTS[k]||"";
    return '<div class="cblock" style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px"><b>'+esc(label)+'</b><span class="muted" style="font-size:11px">'+esc(k)+'</span></div>'
      +'<textarea id="c_'+k+'" style="width:100%;min-height:52px" placeholder="Varsayılan: '+esc(def)+'">'+esc(val)+'</textarea>'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">'
        +'<label class="check" style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="ce_'+k+'" '+(en?"checked":"")+'> Sitede göster</label>'
        +'<div style="display:flex;gap:6px"><button class="btn sm" onclick="openContentHistory(\''+k+'\')">Geçmiş / Geri Al</button><button class="btn sm primary" onclick="saveContent(\''+k+'\')">Kaydet</button></div>'
      +'</div>'
      +'<div class="muted" id="cmsg_'+k+'" style="font-size:12px;min-height:14px;margin-top:4px"></div>'
    +'</div>';
  }).join("");
  body+='</div>';
  shell(body);
}
async function saveContent(key){
  const val=($("c_"+key).value||"").trim();
  const en=$("ce_"+key).checked;
  const label=(contentRow(key)||{}).label||key;
  const row={key, label, value:val||null, enabled:en, updated_at:new Date().toISOString()};
  const msg=$("cmsg_"+key); if(msg)msg.textContent="Kaydediliyor…";
  try{ const {error}=await db.from("site_content").upsert(row,{onConflict:"key"}); if(error)throw error; }
  catch(e){ if(msg)msg.textContent="Hata: "+(e.message||e); return; }
  const i=DATA.content.findIndex(c=>c.key===key); if(i>=0)DATA.content[i]=Object.assign(DATA.content[i],row); else DATA.content.push(row);
  if(msg)msg.textContent="✓ kaydedildi — sitede Ctrl+Shift+R ile görürsün";
}

    p.innerHTML='<img src="'+esc(img)+'" style="max-width:100%;max-height:220px;border-radius:4px" onerror="this.parentNode.innerHTML=\'<span style=color:#a33>Görsel yüklenemedi\'">';
  } else {
    p.innerHTML='<div style="text-align:center;color:#888"><b>'+(title||"Görsel yok")+'</b><div style="font-size:12px">'+(body||"Görsel URL gir ya da yükle")+'</div></div>';
  }
}
async function adUpload(ev){ const file=ev.target.files&&ev.target.files[0]; if(!file)return; const msg=$("a_upmsg"); if(msg)msg.textContent="Yükleniyor…"; try{ const url=await uploadToMedia(file,"ads"); $("a_image_url").value=url; adPreview(); if(msg)msg.textContent="✓ yüklendi"; }catch(e){ if(msg)msg.textContent="Hata: "+(e.message||e); } }
async function uploadToMedia(file, prefix){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
  const path=(prefix||"img")+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
  const {error}=await db.storage.from("media").upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type||"image/jpeg"});
  if(error)throw error;
  const {data}=db.storage.from("media").getPublicUrl(path);
  return data.publicUrl;
}
async function saveAd(isNew,id){

    sponsor:g("sponsor")||null, title:g("title")||null, body:g("body")||null, image_url:g("image_url")||null, cta_url:g("cta_url")||null,

  $("pa_cancel").onclick=()=>closeModal();

    const delta=parseInt($("pa_delta").value,10); const reason=($("pa_reason").value||"").trim(); const note=($("pa_note").value||"").trim();
    if(!Number.isInteger(delta)||delta===0||delta<-100||delta>100){ $("pa_err").textContent="Değişim −100..+100 arası, 0 dışında bir tam sayı olmalı."; return; }
    if(reason.length<3||reason.length>280){ $("pa_err").textContent="Gerekçe 3–280 karakter olmalı."; return; }
    if(note.length<3||note.length>280){ $("pa_err").textContent="Ayrıntılı not zorunlu (3–280 karakter)."; return; }
    $("pa_ok").disabled=true; $("pa_cancel").disabled=true; $("pa_ok").textContent="İşleniyor…";
    const r=await adminApi("adjust_points",{target:uid,delta:delta,reason:reason,note:note,idempotency_key:idem});

  if(!rows.length){ box.innerHTML='<p class="muted">Kayıt yok.</p>'; return; }
  let h='<div class="tablewrap"><table><thead><tr><th>Tarih</th><th>Admin</th><th>Tablo</th><th>İşlem</th><th>Kayıt</th><th></th></tr></thead><tbody>';
  h+=rows.map(x=>'<tr><td style="white-space:nowrap">'+esc(fmtDate(x.at))+'</td><td class="muted" style="font-size:11px">'+esc((x.actor_uid||"—"))+'</td><td><b>'+esc(x.entity)+'</b></td><td>'+esc(x.action)+'</td><td>'+esc(x.entity_id||"—")+'</td><td><button class="btn sm" onclick="openAuditDetail('+esc(x.id)+')">Detay</button></td></tr>').join("");
  h+='</tbody></table></div>';
  const from=CL.offset+1, to=CL.offset+rows.length;
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span class="muted">'+from+'–'+to+' / '+CL.total+'</span><span style="display:flex;gap:6px">'
    +'<button class="btn sm" '+(CL.offset<=0?"disabled":"")+' onclick="clSearch('+Math.max(0,CL.offset-CL.limit)+')">← Önceki</button>'
    +'<button class="btn sm" '+(to>=CL.total?"disabled":"")+' onclick="clSearch('+(CL.offset+CL.limit)+')">Sonraki →</button></span></div>';
  box.innerHTML=h;
}
async function openAuditDetail(id){
  openModal();
  $("sheet").innerHTML='<h2>Değişiklik detayı</h2><p class="muted">Yükleniyor…</p><div class="foot"><button class="btn" onclick="closeModal()">Kapat</button></div>';
  const r=await adminApi("audit_detail",{id:id});
  if(r.status!==200){ $("sheet").innerHTML='<h2>Değişiklik detayı</h2><div class="notice err">'+esc(apiErrText(r.status))+'</div><div class="foot"><button class="btn" onclick="closeModal()">Kapat</button></div>'; return; }
  const d=(r.body&&r.body.data)||{};
  const jshow=o=>{ if(o==null)return '<span class="muted">—</span>'; try{ return '<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;background:#f6f6f4;padding:8px;border-radius:6px;max-height:200px;overflow:auto">'+esc(JSON.stringify(o,null,2))+'</pre>'; }catch(e){ return esc(String(o)); } };
  let h='<h2>Değişiklik detayı</h2>';
  h+='<div class="acc"><div class="accitem"><div class="accbody">'
    +'<div class="accrow"><span><b>Tarih</b></span><span>'+esc(fmtDate(d.at))+'</span></div>'
    +'<div class="accrow"><span><b>Admin</b></span><span class="muted" style="font-size:12px">'+esc(d.actor_uid||"—")+'</span></div>'
    +'<div class="accrow"><span><b>Tablo</b></span><span>'+esc(d.entity)+'</span></div>'
    +'<div class="accrow"><span><b>İşlem</b></span><span>'+esc(d.action)+'</span></div>'
    +'<div class="accrow"><span><b>Kayıt</b></span><span>'+esc(d.entity_id||"—")+'</span></div>'
    +'</div></div></div>';
  h+='<div style="margin-top:10px"><b>Önce</b>'+jshow(d.before)+'</div><div style="margin-top:8px"><b>Sonra</b>'+jshow(d.after)+'</div>';
  h+='<div class="hint" style="margin-top:8px">Alanlar güvenli allowlist ile gösterilir.</div>';
  h+='<div class="foot"><button class="btn" onclick="closeModal()">Kapat</button></div>';
  $("sheet").innerHTML=h;
}

/* ---------- modal ---------- */
function openModal(){ $("modal").classList.remove("hide"); }
function closeModal(){ $("modal").classList.add("hide"); }
$("modal").onclick=e=>{ if(e.target===$("modal"))closeModal(); };

async function boot(){
  $("app").innerHTML='<div class="wrap"><p class="muted" style="padding:40px;text-align:center">Yükleniyor…</p></div>';
  await loadAll();
  render();
}
bootGate();
</script>

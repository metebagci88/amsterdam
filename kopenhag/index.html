<!DOCTYPE html>
<html lang="tr" data-asa-city-state="stub">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="asa-city-code" content="dk-cph" />
<title>Kopenhag · AsaLocal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcf9f5;--ink:#1c1c1a;--ink2:#464840;--accent2:#272e1b;--line:#e5e2de}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{border-bottom:1px solid var(--line);background:rgba(250,249,246,.9)}
.bar{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.back{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.brand{font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:600;color:var(--accent2)}
.sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
main{max-width:720px;margin:0 auto;padding:56px 20px 80px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:36px;letter-spacing:-.02em;margin:0 0 12px}
p{margin:0;font-size:17px;color:var(--ink2)}
a.home{display:inline-block;margin-top:22px;color:var(--accent2);font-weight:600;text-decoration:none}
a.home:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="back" href="/" title="Ana sayfa">←</a>
    <div>
      <div class="brand">AsaLocal Club</div>
      <div class="sub">Kopenhag</div>
    </div>
  </div>
</header>
<main>
  <h1>Kopenhag</h1>
  <p>Kopenhag içerikleri hazırlanıyor.</p>
  <a class="home" href="/">Ana sayfaya dön</a>
</main>
</body>
</html>

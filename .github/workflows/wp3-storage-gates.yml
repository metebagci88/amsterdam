name: WP3 storage city isolation gates
# İŞ PAKETİ 3 — browser storage şehir izolasyonu (asa:ams:*). Birim + statik sözleşme + jsdom UX
# kontrolü + Playwright (yerel python http.server; tüm dış istekler route() stub'ı, CI'da ağ açık olsa
# da determinizm için) + SHA256SUMS + Kopenhag stub byte eşitliği + secret scan → "WP3_GATES_PASS" şart.
# Exit 4 (bağımlılık/geçmiş yok → INCOMPLETE) KIRMIZIDIR. Deploy etmez; Supabase'e ve canlı siteye
# bağlanmaz; secret kullanmaz.
on:
  workflow_dispatch: {}
  push:
    branches: [cdp3b-asset-preview-2y4qmd]
    paths: ["WP3_package/**", "lib/asa-storage/**", "amsterdam/index.html", "index.html", ".github/workflows/wp3-storage-gates.yml"]
  pull_request:
    paths:
      - "amsterdam/index.html"
      - "index.html"
      - "kopenhag/index.html"
      - "lib/asa-storage/**"
      - "scripts/ux_sprint1_trust_check.mjs"
      - "SHA256SUMS"
      - "WP3_package/**"
      - ".github/workflows/wp3-storage-gates.yml"
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # WP3_BASE_REF (7a548e9) geri dönüş kanıtı için gerekli

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıklar (sabit sürümler, checkout DIŞINA) + Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wp3deps" && cd "$RUNNER_TEMP/wp3deps"
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund playwright@1.56.1 jsdom@24.1.3
          npx playwright install --with-deps chromium

      - name: WP3 gates (unit + UX + e2e desktop/390px + SHA256SUMS + CPH stub + secret scan)
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/wp3deps/node_modules" bash WP3_package/tests/run_all.sh 2>&1 | tee "$RUNNER_TEMP/wp3_gate.log"
          grep -qx 'WP3_GATES_PASS' "$RUNNER_TEMP/wp3_gate.log" || { echo "GATE_FAILED:wp3"; exit 1; }

      - name: Secret scan (gate logu)
        if: always()
        run: |
          set -uo pipefail
          if [ -f "$RUNNER_TEMP/wp3_gate.log" ]; then bash CDP3C_package/gates/secret_scan.sh "$RUNNER_TEMP/wp3_gate.log" || exit 1; fi

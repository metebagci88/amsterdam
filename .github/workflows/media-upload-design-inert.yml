name: Media upload design inert

# Unit tests for the admin-api media_upload helper and the in-repo splice.
# Does not deploy Edge, does not edit admin HTML, and does not change storage policies.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "CDP3B/edge/admin-api/MEDIA_UPLOAD_DESIGN.md"
      - "CDP3B/edge/admin-api/index.ts"
      - "CDP3B/edge/admin-api/inert/**"
      - ".github/workflows/media-upload-design-inert.yml"
      - ".github/workflows/cdp3c-edge-integration.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --experimental-strip-types --test CDP3B/edge/admin-api/inert/media_upload.test.ts CDP3B/edge/admin-api/inert/media_upload_storage.integration.test.ts
      - name: Secret scan
        run: bash CDP3C_package/gates/secret_scan.sh CDP3B/edge/admin-api/MEDIA_UPLOAD_DESIGN.md CDP3B/edge/admin-api/inert CDP3B/edge/admin-api/index.ts

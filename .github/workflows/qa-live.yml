name: QA live (dedicated test accounts, hash handshake)

# Canlı admin/üye kabul testleri — ADANMIŞ, ETİKETLİ test hesaplarıyla.
# Parola yalnız bu runner'ın belleğinde/RUNNER_TEMP'te rastgele üretilir ve maskelenir;
# dışarı yalnız bcrypt özeti çıkar (qa_signals/<run>/hashes.json). Operatör özeti Supabase'de
# test hesabına yazar; runner giriş yapabildiğinde testleri koşar. Adımlar arasında operatör
# snapshot alır ve qa_signals/<run>/go_<adım> ile devam izni verir (abort ile durdurur).
# Tetik: qa_signals/request/** altına bir istek dosyası push edilmesi. Kimlik bilgisi/secret
# kullanılmaz; ücretli kaynak yok.
on:
  push:
    branches: [cdp3b-asset-preview-2y4qmd]
    paths: ["qa_signals/request/**"]
permissions:
  contents: write
concurrency:
  group: qa-live
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      ASALOCAL_ADMIN_EMAIL: asalocal-qa-admin@example.com
      ASALOCAL_MEMBER_EMAIL: asalocal-qa-member@example.com
      QA_BRANCH: cdp3b-asset-preview-2y4qmd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cdp3b-asset-preview-2y4qmd
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencies (pinned)
        run: |
          set -euo pipefail
          { echo "QA_DEPS=$RUNNER_TEMP/qadeps"; echo "S1_OUT_DIR=$RUNNER_TEMP/s1out"; echo "S1_NODE_MODULES=$RUNNER_TEMP/qadeps/node_modules"; } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/qadeps" "$RUNNER_TEMP/s1out"
          cd "$RUNNER_TEMP/qadeps"
          npm init -y >/dev/null
          npm i --no-audit --no-fund bcryptjs@2.4.3 playwright@1.56.1 @supabase/supabase-js@2.117.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Selftest
        run: node LIVE_CHECKS/qa/qa_runner.mjs selftest
      - name: Phases + target from the triggering request file (default s1,s2 on production)
        env:
          EV_BEFORE: ${{ github.event.before }}
          EV_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          range="HEAD~1 HEAD"
          if [ -n "${EV_BEFORE:-}" ] && ! [[ "$EV_BEFORE" =~ ^0+$ ]] && git cat-file -e "$EV_BEFORE" 2>/dev/null; then range="$EV_BEFORE $EV_AFTER"; fi
          req="$(git diff --name-only $range -- qa_signals/request/ | tail -1 || true)"
          phases="s1,s2"; url="https://www.asalocal.club"; xfail=""
          if [ -n "$req" ] && [ -f "$req" ]; then
            xfail="$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String(j.wp6_xfail||""))' "$req")"
            phases="$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String(j.phases||"s1,s2"))' "$req")"
            url="$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String(j.url||"https://www.asalocal.club"))' "$req")"
          fi
          case "$phases" in *[!a-z0-9,]*) echo "bad phases"; exit 2;; esac
          case "$url" in https://www.asalocal.club|https://*.amsterdam-zhw.pages.dev) ;; *) echo "refusing url: $url"; exit 2;; esac
          case "$xfail" in *[!A-Za-z0-9/_,.-]*) echo "bad wp6_xfail"; exit 2;; esac
          { echo "QA_PHASES=,$phases,"; echo "ASALOCAL_BASE_URL=$url"; echo "QA_WP6_XFAIL=$xfail"; } >> "$GITHUB_ENV"
          echo "request=$req phases=$phases url=$url wp6_xfail=${xfail:-none}"
      - name: Generate passwords in-runner, publish bcrypt hashes only
        run: node LIVE_CHECKS/qa/qa_runner.mjs gen
      - name: Wait for operator to install hashes (login poll)
        run: node LIVE_CHECKS/qa/qa_runner.mjs wait-login
      - name: "S1: preflight + runtime + negative tests (no upload)"
        if: contains(env.QA_PHASES, ',s1,')
        run: |
          set +e -uo pipefail
          set -a; . "$RUNNER_TEMP/qa_secrets.env"; set +a
          cd SEC_MEDIA_package/stage1
          node gates/s1_admin_upload_acceptance.mjs --preflight; e1=$?
          node gates/s1_admin_upload_acceptance.mjs --runtime;   e2=$?
          node gates/s1_negative.mjs;                            e3=$?
          echo "{\"preflight\":$e1,\"runtime\":$e2,\"negative\":$e3}" > "$S1_OUT_DIR/exit_a.json"
          cat "$S1_OUT_DIR/exit_a.json"
      - name: Publish step A results
        if: contains(env.QA_PHASES, ',s1,')
        run: node LIVE_CHECKS/qa/qa_runner.mjs signal tests_a "$S1_OUT_DIR/exit_a.json" "$S1_OUT_DIR/s1_preflight_result.json" "$S1_OUT_DIR/s1_runtime_result.json" "$S1_OUT_DIR/s1_negative_result.json"
      - name: Wait for operator (MID0 snapshot) -> go_upload
        if: contains(env.QA_PHASES, ',s1,')
        run: node LIVE_CHECKS/qa/qa_runner.mjs wait upload
      - name: "S1: the single real admin upload"
        if: contains(env.QA_PHASES, ',s1,')
        run: |
          set +e -uo pipefail
          set -a; . "$RUNNER_TEMP/qa_secrets.env"; set +a
          cd SEC_MEDIA_package/stage1
          S1_CONFIRM_UPLOAD=YES node gates/s1_admin_upload_acceptance.mjs; e=$?
          echo "{\"upload\":$e}" > "$S1_OUT_DIR/exit_b.json"; cat "$S1_OUT_DIR/exit_b.json"
      - name: Publish upload result
        if: contains(env.QA_PHASES, ',s1,')
        run: node LIVE_CHECKS/qa/qa_runner.mjs signal uploaded "$S1_OUT_DIR/exit_b.json" "$S1_OUT_DIR/s1_upload_result.json"
      - name: Wait for operator (MID snapshot) -> go_cleanup
        if: contains(env.QA_PHASES, ',s1,')
        run: node LIVE_CHECKS/qa/qa_runner.mjs wait cleanup
      - name: "S1: cleanup via temporary qa-media-cleanup + verify gone"
        if: contains(env.QA_PHASES, ',s1,')
        run: |
          set +e -uo pipefail
          set -a; . "$RUNNER_TEMP/qa_secrets.env"; set +a
          node LIVE_CHECKS/qa/qa_runner.mjs cleanup "$S1_OUT_DIR/s1_object_ref.local.json"; e1=$?
          (cd SEC_MEDIA_package/stage1 && node gates/s1_admin_upload_acceptance.mjs --verify-gone); e2=$?
          echo "{\"cleanup\":$e1,\"verify_gone\":$e2}" > "$S1_OUT_DIR/exit_c.json"; cat "$S1_OUT_DIR/exit_c.json"
      - name: Publish cleanup result
        if: contains(env.QA_PHASES, ',s1,')
        run: node LIVE_CHECKS/qa/qa_runner.mjs signal cleaned "$S1_OUT_DIR/exit_c.json" "$S1_OUT_DIR/qa_cleanup_result.json" "$S1_OUT_DIR/s1_verify_gone_result.json"
      - name: Wait for operator (POST snapshot + Stage 2 apply) -> go_s2
        if: contains(env.QA_PHASES, ',s2,')
        run: node LIVE_CHECKS/qa/qa_runner.mjs wait s2
      - name: "S2: production HTTP acceptance"
        if: contains(env.QA_PHASES, ',s2,')
        run: |
          set +e -uo pipefail
          set -a; . "$RUNNER_TEMP/qa_secrets.env"; set +a
          node LIVE_CHECKS/qa/qa_runner.mjs s2-http; e=$?
          echo "{\"s2_http\":$e}" > "$S1_OUT_DIR/exit_d.json"; cat "$S1_OUT_DIR/exit_d.json"
      - name: Publish S2 result
        if: contains(env.QA_PHASES, ',s2,')
        run: node LIVE_CHECKS/qa/qa_runner.mjs signal s2 "$S1_OUT_DIR/exit_d.json" "$S1_OUT_DIR/s2_http_result.json"
      - name: "WP4: logged-in member account menu (read/navigate only)"
        if: contains(env.QA_PHASES, ',wp4,')
        run: |
          set +e -uo pipefail
          node LIVE_CHECKS/qa/wp4_live.mjs; e=$?
          echo "{\"wp4_live\":$e}" > "$S1_OUT_DIR/exit_wp4.json"; cat "$S1_OUT_DIR/exit_wp4.json"
      - name: Publish WP4 result
        if: contains(env.QA_PHASES, ',wp4,')
        run: node LIVE_CHECKS/qa/qa_runner.mjs signal wp4 "$S1_OUT_DIR/exit_wp4.json" "$S1_OUT_DIR/wp4_live_result.json"
      - name: "WP5: private name + profile completion (QA member, own row only)"
        if: contains(env.QA_PHASES, ',wp5,')
        run: |
          set +e -uo pipefail
          node LIVE_CHECKS/qa/wp5_live.mjs; e=$?
          echo "{\"wp5_live\":$e}" > "$S1_OUT_DIR/exit_wp5.json"; cat "$S1_OUT_DIR/exit_wp5.json"
      - name: Publish WP5 result
        if: contains(env.QA_PHASES, ',wp5,')
        run: node LIVE_CHECKS/qa/qa_runner.mjs signal wp5 "$S1_OUT_DIR/exit_wp5.json" "$S1_OUT_DIR/wp5_live_result.json"
      - name: "WP6: end-to-end acceptance (anon + QA member, controlled writes undone in-run)"
        if: contains(env.QA_PHASES, ',wp6,')
        env:
          WP6_XFAIL: ${{ env.QA_WP6_XFAIL }}
        run: |
          set +e -uo pipefail
          node LIVE_CHECKS/qa/wp6_live.mjs; e=$?
          echo "{\"wp6_live\":$e}" > "$S1_OUT_DIR/exit_wp6.json"; cat "$S1_OUT_DIR/exit_wp6.json"
      - name: Publish WP6 result
        if: contains(env.QA_PHASES, ',wp6,')
        run: node LIVE_CHECKS/qa/qa_runner.mjs signal wp6 "$S1_OUT_DIR/exit_wp6.json" "$S1_OUT_DIR/wp6_live_result.json"
      - name: Secret scan of outputs
        if: always()
        run: |
          set -uo pipefail
          rm -f "$RUNNER_TEMP/qa_secrets.env"
          bash CDP3C_package/gates/secret_scan.sh "$S1_OUT_DIR" qa_signals || exit 1

name: WP7 launch gates
# İŞ PAKETİ 7 — Amsterdam beta: public wording (Listem / Kendi notun, no internal or admin vocabulary), the admin venue
# editor labels, no seeded favourites, no embedded venue note values. Runs the full WP5 web gate chain (WP5 + WP4 + WP3 +
# UX Sprint 1 + WSE + pins + SHA256SUMS + secret scan) and the WP7 checks: label unit tests (jsdom), the public leak gate
# (local python http.server; every non-local request answered by a route() stub; anon + member × 1280 + 390 × embedded +
# stub-DB sentinel data) and its mutation self-test. Exit 4 (missing dependency/history → INCOMPLETE) is RED.
# Deploys nothing; never contacts Supabase or the live site; applies no migration; uses no secret.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "index.html"
      - "amsterdam/index.html"
      - "kopenhag/index.html"
      - "CDP3B/admin.html"
      - "_redirects"
      - "_headers"
      - "scripts/**"
      - "WP3_package/**"
      - "WP4_package/**"
      - "WP5_package/web/**"
      - "lib/**"
      - "SHA256SUMS"
      - ".github/workflows/wp7-launch-gates.yml"
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # WP5/WP4/WP3 reference commits (cfdf79e, 7801394, 7a548e9) + the WP7 base (7ae9030) for the scope check

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıklar (sabit sürümler, checkout DIŞINA) + Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wp7deps" && cd "$RUNNER_TEMP/wp7deps"
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund playwright@1.56.1 jsdom@24.1.3 tailwindcss@3.4.17 @tailwindcss/forms@0.5.10 @tailwindcss/container-queries@0.1.1
          npx playwright install --with-deps chromium
          command -v python3 >/dev/null || { echo "MISSING_DEP python3"; exit 1; }

      - name: WP5 web gates (WP5 + WP4 + WP3 + UX Sprint 1 + WSE + pins + SHA256SUMS + secret scan)
        env:
          WP4_SCOPE_CHECKS: "0"
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/wp7deps/node_modules" bash WP5_package/web/tests/run_all.sh 2>&1 | tee "$RUNNER_TEMP/wp7_wp5_chain.log"
          grep -qx 'WP5_WEB_GATES_PASS' "$RUNNER_TEMP/wp7_wp5_chain.log" || { echo "GATE_FAILED:wp5_web_chain"; exit 1; }

      - name: WP7 label unit tests (publicNote / srcGroup / embedded data / admin venue editor in jsdom)
        env:
          # one-time scope check (admin e-mail module byte-identical to the WP7 base) only on the WP7 branch's own PR
          WP7_SCOPE_CHECKS: ${{ (github.head_ref || github.ref_name) == 'wp7-beta-launch' && '1' || '0' }}
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/wp7deps/node_modules" node --test scripts/wp7_labels_unit.test.mjs 2>&1 | tee "$RUNNER_TEMP/wp7_unit.log"
          grep -qE '^# fail 0$' "$RUNNER_TEMP/wp7_unit.log" && grep -qE '^# pass [1-9]' "$RUNNER_TEMP/wp7_unit.log" || { echo "GATE_FAILED:wp7_unit"; exit 1; }

      - name: Public leak gate (anon + member × 1280 + 390 × embedded + stub-DB sentinels; raw bytes of / /amsterdam/ /kopenhag/)
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/wp7deps/node_modules" node scripts/public_leak_gate.mjs 2>&1 | tee "$RUNNER_TEMP/wp7_leak_gate.log"
          grep -qx 'PUBLIC_LEAK_GATE_PASS' "$RUNNER_TEMP/wp7_leak_gate.log" || { echo "GATE_FAILED:public_leak_gate"; exit 1; }

      - name: Public leak gate self-test (every mutation must FAIL, the unmutated copy must PASS)
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/wp7deps/node_modules" node scripts/public_leak_gate.mjs --selftest 2>&1 | tee "$RUNNER_TEMP/wp7_leak_selftest.log"
          grep -qx 'PUBLIC_LEAK_GATE_SELFTEST_PASS' "$RUNNER_TEMP/wp7_leak_selftest.log" || { echo "GATE_FAILED:public_leak_gate_selftest"; exit 1; }

      - name: Secret scan (WP7 gate files + logs)
        if: always()
        run: |
          set -uo pipefail
          bash CDP3C_package/gates/secret_scan.sh scripts/public_leak_gate.mjs scripts/wp7_labels_unit.test.mjs .github/workflows/wp7-launch-gates.yml || exit 1
          for f in wp7_wp5_chain wp7_unit wp7_leak_gate wp7_leak_selftest; do
            if [ -f "$RUNNER_TEMP/$f.log" ]; then bash CDP3C_package/gates/secret_scan.sh "$RUNNER_TEMP/$f.log" || exit 1; fi
          done

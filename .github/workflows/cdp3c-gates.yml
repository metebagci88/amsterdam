# CDP-3C Gates — ephemeral local Supabase (production'a DOKUNMAZ)
# KANONİK KONUM: repo kökü .github/workflows/cdp3c-gates.yml
# Repo ağacı: .github/workflows/cdp3c-gates.yml + CDP3C_package/... + SHA256SUMS (repo kökü)
name: CDP-3C Gates
on:
  workflow_dispatch: {}
  pull_request:
    paths: ["CDP3C_package/**", ".github/workflows/cdp3c-gates.yml", "SHA256SUMS"]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOGDIR: ${{ github.workspace }}/cdp3c_logs
      CDP3C_ALLOW_DESTRUCTIVE: "1"   # yalnız ephemeral CI; mutating harness guard'ı bunu + local-host + sentinel arar
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$LOGDIR"

      # GATE — manifest drift (statik; DB'siz): CDP3C_up.sql ↔ kanonik obje manifesti
      - name: Gate — manifest_check
        run: |
          set -uo pipefail
          out="$(bash CDP3C_package/gates/cdp3c_manifest_check.sh 2>&1)"; rc=$?
          printf '%s\n' "$out" | tee "$LOGDIR/00a_manifest.log"
          if [ $rc -ne 0 ] || ! grep -q "CDP3C_MANIFEST_CHECK_PASS" <<<"$out"; then echo "GATE_FAILED:manifest_check"; exit 1; fi

      - name: "Gate — manifest_selftest (parser uppercase/multiline/overload)"
        run: |
          set -uo pipefail
          out="$(bash CDP3C_package/gates/cdp3c_manifest_selftest.sh 2>&1)"; rc=$?
          printf '%s\n' "$out" | tee "$LOGDIR/00a2_manifest_selftest.log"
          if [ $rc -ne 0 ] || ! grep -q "MANIFEST_SELFTEST_PASS" <<<"$out"; then echo "GATE_FAILED:manifest_selftest"; exit 1; fi

      # GATE 0 — paket + WORKFLOW bütünlüğü (fail-closed)
      - name: Gate — SHA256SUMS
        run: |
          set -uo pipefail
          out="$(sha256sum -c SHA256SUMS 2>&1)"; rc=$?
          printf '%s\n' "$out" | tee "$LOGDIR/00_sha256.log"
          if [ $rc -ne 0 ]; then echo "GATE_FAILED:sha256sums"; exit 1; fi

      - name: Gate — secret_scan self-test
        run: |
          set -uo pipefail
          out="$(bash CDP3C_package/gates/secret_scan_selftest.sh 2>&1)"; rc=$?
          printf '%s\n' "$out" | tee "$LOGDIR/00b_scan_selftest.log"
          if [ $rc -ne 0 ] || ! grep -q "SECRET_SCAN_SELFTEST_PASS" <<<"$out"; then echo "GATE_FAILED:scan_selftest"; exit 1; fi

      - uses: supabase/setup-cli@v1
        with:
          version: 1.226.4   # PIN (zorunlu): 'latest' YASAK; ilk kabul koşusunda log'la teyit edilir

      - name: Gate — stack (ephemeral) + env
        run: |
          set -uo pipefail
          if [ ! -f CDP3C_package/supabase/config.toml ]; then
            (cd CDP3C_package && supabase init --force) 2>&1 | tee "$LOGDIR/01_init.log"; rc=${PIPESTATUS[0]}
            [ $rc -eq 0 ] || { echo "GATE_FAILED:stack_init"; exit 1; }
          fi
          # CI LOG-TAŞIMA KATMANI redaksiyonu (yalnız log/stdout): supabase start, her makinede AYNI olan
          # yerel-dev anon/service_role JWT'lerini basar; bunlar gerçek gizli DEĞİLDİR ama final secret-scan'in
          # JWT desenini tetikler. tee'ye/stdout'a ULAŞMADAN ÖNCE JWT-biçimli değerleri [REDACTED_LOCAL_JWT] yap.
          # supabase'in GERÇEK exit code'u PIPESTATUS[0] (ilk boru öğesi = alt kabuk) ile korunur. Paket/SQL davranışı DEĞİŞMEZ.
          (cd CDP3C_package && supabase start) 2>&1 | sed -E 's#eyJ[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}#[REDACTED_LOCAL_JWT]#g' | tee "$LOGDIR/01_start.log"; rc=${PIPESTATUS[0]}
          [ $rc -eq 0 ] || { echo "GATE_FAILED:stack_start"; exit 1; }
          ST="$(cd CDP3C_package && supabase status -o env 2>&1)"; rc=$?
          [ $rc -eq 0 ] || { echo "GATE_FAILED:stack_status"; printf '%s\n' "$ST" | sed -E 's#eyJ[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}#[REDACTED_LOCAL_JWT]#g' | tee "$LOGDIR/01b_status.log"; exit 1; }
          DB_URL="$(printf '%s\n' "$ST" | sed -n 's/^DB_URL=\"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p')"
          [ -n "$DB_URL" ] || { echo "GATE_FAILED:db_url"; exit 1; }
          echo "::add-mask::$DB_URL"; echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Gate — extensions (vault + pgcrypto)
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -c "create extension if not exists supabase_vault cascade;" \
            -c "create extension if not exists pgcrypto with schema extensions;" 2>&1 | tee "$LOGDIR/02_ext.log" || { echo "GATE_FAILED:extensions"; exit 1; }

      - name: Gate — baseline (test double; sentinel + _admin revokes)
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f CDP3C_package/gates/cdp3c_baseline.sql 2>&1 | tee "$LOGDIR/03_baseline.log" || { echo "GATE_FAILED:baseline"; exit 1; }

      - name: Gate — guard_selftest (ephemeral guard negatif+pozitif)
        # baseline ÖNCE koşar: guard_selftest ilk mutasyondan önce sentinel MARKER'ı (baseline'ın yarattığı)
        # doğrular; bu yüzden baseline'dan SONRA gelir (v9-#3).
        run: |
          set -uo pipefail
          out="$(bash CDP3C_package/gates/cdp3c_guard_selftest.sh "$SUPABASE_DB_URL" 2>&1)"; rc=$?
          printf '%s\n' "$out" | tee "$LOGDIR/02b_guard_selftest.log"
          if [ $rc -ne 0 ] || ! grep -q "GUARD_SELFTEST_PASS" <<<"$out"; then echo "GATE_FAILED:guard_selftest"; exit 1; fi

      - name: Gate — preflight contracts (gerçek Vault/pgcrypto ile PASS bekleniyor)
        run: |
          set -uo pipefail
          out="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f CDP3C_package/gates/cdp3c_preflight.sql 2>&1)"; rc=$?
          printf '%s\n' "$out" | tee "$LOGDIR/04_preflight.log"
          if [ $rc -ne 0 ] || ! grep -q "CDP3C_PREFLIGHT_PASS" <<<"$out"; then echo "GATE_FAILED:preflight"; exit 1; fi

      - name: Gate — preflight_objects (PRE-APPLY; CDP-3C nesneleri YOK)
        run: |
          set -uo pipefail
          out="$(bash CDP3C_package/gates/cdp3c_preflight_objects.sh "$SUPABASE_DB_URL" CDP3C_package/gates/cdp3c_objects.manifest 2>&1)"; rc=$?
          printf '%s\n' "$out" | tee "$LOGDIR/04b_preflight_objects.log"
          if [ $rc -ne 0 ] || ! grep -q "CDP3C_PREFLIGHT_OBJECTS_PASS" <<<"$out"; then echo "GATE_FAILED:preflight_objects"; exit 1; fi

      - name: Gate — migration apply
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f CDP3C_package/CDP3C_up.sql 2>&1 | tee "$LOGDIR/05_up.log" || { echo "GATE_FAILED:up_apply"; exit 1; }

      - name: Gate — idempotent re-apply
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f CDP3C_package/CDP3C_up.sql 2>&1 | tee "$LOGDIR/06_reapply.log" || { echo "GATE_FAILED:up_reapply"; exit 1; }

      - name: Gate — invariants
        run: |
          set -uo pipefail
          out="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f CDP3C_package/gates/cdp3c_invariants.sql 2>&1)"; rc=$?
          printf '%s\n' "$out" | tee "$LOGDIR/07_invariants.log"
          if [ $rc -ne 0 ] || ! grep -q "CDP3C_INVARIANTS_PASS" <<<"$out"; then echo "GATE_FAILED:invariants"; exit 1; fi

      - name: Gate — privilege_matrix (dinamik)
        run: |
          set -uo pipefail
          out="$(bash CDP3C_package/gates/cdp3c_privilege_matrix.sh "$SUPABASE_DB_URL" CDP3C_package/gates/cdp3c_objects.manifest 2>&1)"; rc=$?
          printf '%s\n' "$out" | tee "$LOGDIR/07b_privilege.log"
          if [ $rc -ne 0 ] || ! grep -q "CDP3C_PRIVILEGE_MATRIX_PASS" <<<"$out"; then echo "GATE_FAILED:privilege_matrix"; exit 1; fi

      - name: Gate — hosted tests
        run: |
          set -uo pipefail
          out="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f CDP3C_package/gates/cdp3c_tests.sql 2>&1)"; rc=$?
          printf '%s\n' "$out" | tee "$LOGDIR/08_tests.log"
          if [ $rc -ne 0 ] || ! grep -q "CDP3C_TESTS_PASS" <<<"$out"; then echo "GATE_FAILED:tests"; exit 1; fi

      - name: Gate — concurrency (iki-bağlantı; guard'lı)
        run: |
          set -uo pipefail
          out="$(bash CDP3C_package/gates/cdp3c_concurrency.sh "$SUPABASE_DB_URL" 2>&1)"; rc=$?
          printf '%s\n' "$out" | tee "$LOGDIR/09_concurrency.log"
          if [ $rc -ne 0 ] || ! grep -q "CDP3C_CONCURRENCY_PASS" <<<"$out"; then echo "GATE_FAILED:concurrency"; exit 1; fi

      - name: Gate — soft-down + assert
        run: |
          set -uo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f CDP3C_package/CDP3C_down_soft.sql 2>&1 | tee "$LOGDIR/10_downsoft.log"; rc1=$?
          out="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f CDP3C_package/gates/cdp3c_downsoft_assert.sql 2>&1)"; rc2=$?
          printf '%s\n' "$out" | tee "$LOGDIR/11_downsoft_assert.log"
          if [ $rc1 -ne 0 ] || [ $rc2 -ne 0 ] || ! grep -q "CDP3C_DOWNSOFT_ASSERT_PASS" <<<"$out"; then echo "GATE_FAILED:downsoft"; exit 1; fi

      - name: Gate — preflight_selftest (AYRI ephemeral DB; negatif fixture'lar)
        run: |
          set -uo pipefail
          # DROP ve CREATE DATABASE AYRI -c (CREATE DATABASE transaction block'ta çalışmaz; düzeltme #1)
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "drop database if exists cdp3c_selftest" 2>&1 | tee "$LOGDIR/12_selftest.log"; rc=${PIPESTATUS[0]}
          [ $rc -eq 0 ] || { echo "GATE_FAILED:selftest_db_drop"; exit 1; }
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "create database cdp3c_selftest" 2>&1 | tee -a "$LOGDIR/12_selftest.log"; rc=${PIPESTATUS[0]}
          [ $rc -eq 0 ] || { echo "GATE_FAILED:selftest_db_create"; exit 1; }
          SELF_URL="$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#/[^/?]+(\?|$)#/cdp3c_selftest\1#')"
          # selftest DB'yi ÖNCE baseline+sentinel ile hazırla (script sentinel MARKER'ı doğrular)
          psql "$SELF_URL" -v ON_ERROR_STOP=1 -f CDP3C_package/gates/cdp3c_baseline.sql 2>&1 | tee -a "$LOGDIR/12_selftest.log"; rc=${PIPESTATUS[0]}
          [ $rc -eq 0 ] || { echo "GATE_FAILED:selftest_db_baseline"; exit 1; }
          out="$(bash CDP3C_package/gates/cdp3c_preflight_selftest.sh "$SELF_URL" /dev/null CDP3C_package/gates/cdp3c_baseline.sql CDP3C_package/gates/cdp3c_preflight.sql 2>&1)"; rc=$?
          printf '%s\n' "$out" | tee -a "$LOGDIR/12_selftest.log"
          # cleanup (maskeleme YOK; durum raporlanır)
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "drop database if exists cdp3c_selftest" 2>&1 | tee -a "$LOGDIR/12_selftest.log"; drc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ] || ! grep -q "PREFLIGHT_SELFTEST_PASS" <<<"$out"; then echo "GATE_FAILED:preflight_selftest"; exit 1; fi
          [ $drc -eq 0 ] || { echo "GATE_FAILED:selftest_db_cleanup(rc=$drc)"; exit 1; }

      # --- FAIL-CLOSED KAPANIŞ: teardown → final secret-scan → sentinel(if:success) → tek artifact ---
      - name: Teardown (fail-closed) + residue=0
        if: always()
        run: |
          set -uo pipefail
          (cd CDP3C_package && supabase stop --no-backup) 2>&1 | tee "$LOGDIR/98_teardown.log" || { echo "GATE_FAILED:teardown_stop" | tee -a "$LOGDIR/98_teardown.log"; exit 1; }
          c="$(docker ps -aq --filter 'name=supabase_' | wc -l | tr -d ' ')"; v="$(docker volume ls -q --filter 'name=supabase_' | wc -l | tr -d ' ')"
          echo "container_count=$c volume_count=$v" | tee -a "$LOGDIR/98_teardown.log"
          if [ "$c" = "0" ] && [ "$v" = "0" ]; then echo "residue=zero" | tee -a "$LOGDIR/98_teardown.log"; else echo "GATE_FAILED:residue" | tee -a "$LOGDIR/98_teardown.log"; exit 1; fi

      - name: Final secret-scan (loglar + teardown.log + paket)
        if: always()
        run: |
          set -uo pipefail
          out="$(bash CDP3C_package/gates/secret_scan.sh "$LOGDIR" CDP3C_package 2>&1)"; rc=$?
          printf '%s\n' "$out" | tee "$LOGDIR/99_secret_scan.log"
          if [ $rc -ne 0 ] || ! grep -q "secret_scan_clean" <<<"$out"; then echo "GATE_FAILED:secret_scan"; exit 1; fi

      - name: Başarı sentinel'i (yalnız her şey geçtiyse)
        run: echo "LOCAL_CDP3C_GATES_PASS" | tee "$LOGDIR/PASS.txt"

      - name: Tek final artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdp3c-gate-logs
          path: cdp3c_logs/
          if-no-files-found: error
# NOT: yalnız GEÇİCİ yerel stack; production'a dokunmaz, ücretli kaynak açmaz, gerçek gönderim yapmaz.

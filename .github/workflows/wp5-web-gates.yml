name: WP5 web gates
# İŞ PAKETİ 5 — ad-soyad ve profil tamamlama (web): lib/asa-name (ASA_NAME), ana sayfa "Profilini tamamla" çağrısı +
# Profilim Ad/Soyad alanları, şehir sayfası çağrı + Kart alanları, girişte display_name'in ezilmemesi.
# WP5 birim + Playwright (yerel python http.server; tüm dış istekler route() stub'ı; Tailwind her sayfanın kendi config'i
# ile yerelde derlenir; 1366 / 390 / 360) + WP4 / WP3 / UX Sprint 1 / WSE regresyon kapıları + ASA_NAME pin + SHA256SUMS
# + secret scan → "WP5_WEB_GATES_PASS" şart. Exit 4 (bağımlılık/geçmiş yok → INCOMPLETE) KIRMIZIDIR.
# Deploy etmez; Supabase'e ve canlı siteye bağlanmaz; migration uygulamaz; secret kullanmaz.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "index.html"
      - "amsterdam/index.html"
      - "kopenhag/index.html"
      - "lib/**"
      - "scripts/ux_sprint1_trust_check.mjs"
      - "SHA256SUMS"
      - "WP3_package/**"
      - "WP4_package/**"
      - "WP5_package/web/**"
      - "WP5_package/db/WP5_DB_up.sql"
      - "WSE_DEFAULT_package/gates/wse_static_check.mjs"
      - "WSE_DEFAULT_package/SHA256SUMS"
      - ".github/workflows/wp5-web-gates.yml"
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # WP5_PARENT_REF (cfdf79e) + WP4/WP3 referansları (7801394, 7a548e9) için gerekli

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıklar (sabit sürümler, checkout DIŞINA) + Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wp5deps" && cd "$RUNNER_TEMP/wp5deps"
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund playwright@1.56.1 jsdom@24.1.3 tailwindcss@3.4.17 @tailwindcss/forms@0.5.10 @tailwindcss/container-queries@0.1.1
          npx playwright install --with-deps chromium

      - name: WP5 web gates (unit + e2e 1366/390/360 + WP4/WP3/UX/WSE regression + pin + SHA256SUMS + secret scan)
        env:
          # WP4'ün tek seferlik kapsam kontrolleri ("yalnız şu satırlar değişti", "WP5 yok") bu PR'da koşmaz; kalıcı sözleşme koşar.
          WP4_SCOPE_CHECKS: "0"
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/wp5deps/node_modules" bash WP5_package/web/tests/run_all.sh 2>&1 | tee "$RUNNER_TEMP/wp5_web_gate.log"
          grep -qx 'WP5_WEB_GATES_PASS' "$RUNNER_TEMP/wp5_web_gate.log" || { echo "GATE_FAILED:wp5_web"; exit 1; }

      - name: Secret scan (WP5 yeni dosyaları + gate logu)
        if: always()
        run: |
          set -uo pipefail
          bash CDP3C_package/gates/secret_scan.sh WP5_package/web lib/asa-name .github/workflows/wp5-web-gates.yml || exit 1
          if [ -f "$RUNNER_TEMP/wp5_web_gate.log" ]; then bash CDP3C_package/gates/secret_scan.sh "$RUNNER_TEMP/wp5_web_gate.log" || exit 1; fi

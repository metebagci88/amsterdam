name: WSE welcome default inert gates
# Ephemeral local Postgres only. Does not apply SQL to production, does not arm
# activation as a committed step, and does not send mail.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "WSE_DEFAULT_package/**"
      - ".github/workflows/wse-default-gates.yml"
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SHA256SUMS
        working-directory: WSE_DEFAULT_package
        run: sha256sum -c SHA256SUMS
      - name: Static checks
        run: node WSE_DEFAULT_package/gates/wse_static_check.mjs
      - name: Local Postgres
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql postgresql-contrib
          sudo pg_ctlcluster 16 main start
      - name: Ephemeral SQL suite
        run: bash WSE_DEFAULT_package/gates/wse_ephemeral.sh
      - name: Two-session seed race
        run: bash WSE_DEFAULT_package/gates/wse_concurrency.sh

name: Live smoke (anonymous, read-only)

# Production'a karşı GİRİŞSİZ, YAZMASIZ canlı kontrol: sayfa byte/SHA eşitliği,
# redirect sözleşmesi, admin-api reddetme yolları (401/403/415), gerçek Chromium
# ile console/network/mobil taşma kontrolü. Kimlik bilgisi kullanmaz; Storage'a yazmaz.
on:
  workflow_dispatch: {}
  push:
    branches: [cdp3b-asset-preview-2y4qmd]
    paths:
      - "LIVE_CHECKS/**"
      - ".github/workflows/live-smoke.yml"
      - "qa_signals/smoke/**"
permissions:
  contents: read
concurrency:
  group: live-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch origin/main (deployed reference)
        run: git fetch --depth=1 origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Selftest (no network)
        run: node LIVE_CHECKS/live_smoke.mjs --selftest && node LIVE_CHECKS/wp7_live.mjs --selftest
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm i --no-save --no-audit --no-fund playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Live smoke
        run: node LIVE_CHECKS/live_smoke.mjs
      - name: WP3 live storage checks (SKIP until main ships WP3)
        run: node LIVE_CHECKS/wp3_live.mjs
      - name: WP7 launch checks (only when qa_signals/smoke/wp7.json asks for them)
        run: |
          set -euo pipefail
          f=qa_signals/smoke/wp7.json
          if [ ! -f "$f" ]; then echo "no WP7 request"; exit 0; fi
          url=$(node -e 'const j=require("./"+process.argv[1]);process.stdout.write(String(j.url||""))' "$f")
          ref=$(node -e 'const j=require("./"+process.argv[1]);process.stdout.write(String(j.ref||"main"))' "$f")
          [[ "$url" =~ ^https://[A-Za-z0-9.-]+(\.asalocal\.club|\.amsterdam-zhw\.pages\.dev)$ ]] || { echo "bad url"; exit 1; }
          [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad ref"; exit 1; }
          git fetch --depth=1 origin "$ref:refs/remotes/origin/$ref"
          echo "MX asalocal.club: $(dig +short MX asalocal.club | sort | tr '\n' ' ')"
          WP7_BASE="$url" WP7_REF="origin/$ref" node LIVE_CHECKS/wp7_live.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-screenshots
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 7
